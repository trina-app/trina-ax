- id: FLOW-03
  title: Visit prep from notes, scan, quote and room
  features: [files.search, files.view, rooms.messages]
  kind: flow
  lang: en
  context: personal
  as: daniel
  pass1: true
  prompt: I'm visiting Lamaba Cafe on Thursday. Give me a one-page prep sheet - what they asked for, our prices, what we can offer.
  expect:
    outcome: do
    good: Uses the notes, the scanned visit report, the quote, the price list and the room; says 27,000 is the floor without CEO approval and Saturday delivery is courier-only; in English.
    checks:
