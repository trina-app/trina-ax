# ================================================================ files.view (read and understand files)
- id: VIEW-01
  title: Summarise the scanned visit report
  features: [files.view]
  lang: ko
  context: project
  as: sora
  pass1: true
  prompt: 방문보고서 스캔본 내용 요약해줘. 다음에 할 일 위주로.
  expect:
    outcome: do
    good: Reads the scanned pages; next steps (revised quote by 11/13 by 이소라, contract review by 박민호) and the 26,500원 request.
    checks:
      - { type: answer_matches, pattern: "26,?500" }
      - { type: answer_matches, pattern: "11/13|11월 13일|13일" }
  variants:
    - key: en
      lang: en
      as: daniel
      prompt: Summarise the visit report for me in English, 5 bullets.
      expect: { outcome: do, good: Five English bullets from the scanned visit report., checks: [{ type: answer_matches, pattern: "26,?500" }] }
    - key: personal
      context: personal
      as: hana
      prompt: 라마바카페 방문보고서 스캔한 거 핵심만 세 줄로
    - key: outsider
      context: personal
      as: junho
      prompt: 라마바카페 납품 프로젝트에 있는 방문보고서 요약해줘
      pass1: true
      expect: { outcome: refuse, good: junho is not in the project - says he cannot open it and who to ask; nothing from the report., checks: [{ type: answer_not_matches, pattern: "26,?500" }] }
    - key: guest
      context: guest
      as: partner
      install: managed
      prompt: 방문보고서 내용 요약해 주세요
      expect: { outcome: explain, good: The guest is in this project but has no AI here; the app says so plainly., checks: [] }

