- id: SHR-04
  title: Share a whole folder of my own files
  features: [files.folder-share]
  lang: en
  context: personal
  as: daniel
  prompt: Can I share a whole folder in my files with Minho, so he can see everything in it, including what I add later?
  expect:
    outcome: explain
    good: "Plain answer in a few lines, no paths: where folder sharing is on for the team, a folder in his own files can be shared view only (it covers what he adds later; he confirms on a card and can stop or Undo). Where it is not on yet, says so plainly and offers to share the files in the folder with Minho one by one instead. Never claims a folder was shared without a card."
    checks: []

# ================================================================ files people sent in chat rooms (added 2026-11-17)
# The files in these cases were sent as file-only messages: the file's name is never in a message's text, so finding one means
# looking at the room's files (a DM, or a thread reply), not at the words people wrote.
- id: RFILE-01
  title: Find a file I sent to a teammate in a DM
  features: [rooms.files, rooms.search]
  lang: ko
  context: personal
  as: sora
  prompt: 지난주에 강현님한테 보낸 계좌신고서 엑셀 찾아줘
  expect:
    outcome: do
    good: Finds the Excel file 계좌신고서.xlsx that sora sent to 이강현 in their 1:1 chat about a week ago, and says its name, where (the chat with 이강현) and roughly when. May open it and say what it is (an account report form with blanks). Does not say that nothing exists or that it cannot see chat files.
    checks:
      - { type: answer_matches, pattern: "계좌신고서" }
  why: A file sent without any words about it was invisible to the AI (message search reads text only).

- id: RFILE-02
  title: Open a PDF from a thread reply in a group chat
  features: [rooms.threads, rooms.files]
  lang: ko
  context: personal
  as: sora
  prompt: leads 방 스레드에 내가 올린 사업자등록증 PDF 열어서 상호 알려줘
  expect:
    outcome: do
    good: Finds the PDF 사업자등록증.pdf that sora posted as a reply in the thread of the leads chat, reads it, and gives the company name 가나다상사(테스트) (it may add the representative or number). Does not claim the file is missing or that it cannot read thread files.
    checks:
      - { type: answer_matches, pattern: "가나다상사" }
  why: The file is a thread reply with no text naming it; thread replies are not in the room's main timeline.

- id: RFILE-03
  title: Save a file a teammate sent me in a DM to a team folder
  features: [rooms.files, files.upload]
  lang: ko
  context: personal
  as: sora
  prompt: 민지랑 DM에서 받은 견적서 파일 팀 폴더에 저장해줘
  expect:
    outcome: do
    good: Finds 견적서-민지.xlsx in the DM with 김민지, shows the confirmation card for saving it into a team folder (shared, her group's or similar; asks or picks a sensible one), and after her yes the file is in that team folder and the answer says where. No claim of saving before the card.
    checks:
      - { type: file_created, file: "{shared,groups,projects}/**/*견적서-민지*" }
      - { type: tool_used, any: [save_room_file] }
  why: A file received in a DM could not be found by the AI when no message text named it.

# The same three situations in busy rooms: the file-only message sits under 70-80 newer ordinary messages, so reading the
# newest 50 of the room does not reach it. Other people and file names than RFILE-01..03 (so the easy rooms never turn up).
- id: RFILE-04
  title: Find a file I sent in a busy DM
  features: [rooms.files, rooms.search]
  lang: ko
  context: personal
  as: sora
  prompt: 지난주에 도윤님한테 보낸 환불계좌 신청서 엑셀 찾아줘
  expect:
    outcome: do
    good: Finds the Excel file 환불계좌-신청서.xlsx that sora sent to 박도윤 in their 1:1 chat about a week ago (the chat now has 80 newer ordinary messages), and says its name, where (the chat with 박도윤) and roughly when. Does not say that nothing exists, and does not stop after reading only the newest messages.
    checks:
      - { type: answer_matches, pattern: "환불계좌" }
  why: The form is buried; the AI must search the room's files, not just read its latest messages.

- id: RFILE-05
  title: Open a PDF from a thread in a busy group chat
  features: [rooms.threads, rooms.files]
  lang: ko
  context: personal
  as: sora
  prompt: 영업-리드 방 스레드에 내가 올린 통장사본 PDF 열어서 예금주 알려줘
  expect:
    outcome: do
    good: Finds the PDF 통장사본.pdf that sora posted in a thread in the 영업-리드 chat (the thread's root is under 70 newer messages), reads it and gives the account holder 최가짜(가짜). Does not claim the file is missing.
    checks:
      - { type: answer_matches, pattern: "최가짜" }

- id: RFILE-06
  title: Save a file from a busy DM to a team folder
  features: [rooms.files, files.upload]
  lang: ko
  context: personal
  as: sora
  prompt: 다은이랑 DM에서 받은 견적서 파일 팀 폴더에 저장해줘
  expect:
    outcome: do
    good: Finds 견적서-다은.xlsx in the DM with 정다은 (80 newer messages after it), shows the confirmation card for saving it into a team folder, and after her yes the file is in a team folder and the answer says where. No claim of saving before the card.
    checks:
      - { type: file_created, file: "{shared,groups,projects}/**/*견적서-다은*" }
      - { type: tool_used, any: [save_room_file] }

- id: RFILE-07
  title: Fill and seal a form a teammate posted in a thread
  features: [rooms.threads, rooms.files, files.edit]
  lang: ko
  context: personal
  as: sora
  prompt: leads 스레드에 강현님이 올린 계좌신고서 양식 우리 회사 정보로 채워서 직인 찍어줘
  expect:
    outcome: do
    good: "Finds 계좌신고서-양식.pdf in the thread of the leads chat (posted by 이강현) and gets it itself, without asking sora to download or attach it (a copy of the room file goes into her own files). Fills 상호, 사업자등록번호, 대표자, 은행, 계좌번호 and 예금주 from the company's own information in the team files (shared/회사정보/회사-기본정보.md: 가나다오피스 주식회사(가상), 000-00-00001, 박가상(가짜), 가나다은행(가짜), 000-0000-0000-01 (가짜)), invents no numbers, puts the company seal (shared/도장/회사직인.png) at the (인) spot, checks the result, and says where the new PDF is. The room's own file stays as it was. Asks only for something that is really not anywhere (the date, for instance)."
    checks:
      - { type: file_created, file: "{users/sora,shared,groups,projects}/**/*.pdf" }
      - { type: pdf_text, file: "{users/sora,shared,groups,projects}/**/*.pdf", text: "가나다오피스" }
      - { type: pdf_text, file: "{users/sora,shared,groups,projects}/**/*.pdf", text: "000-00-00001" }
      - { type: pdf_image_on_page, file: "{users/sora,shared,groups,projects}/**/*.pdf", page: 1 }
      - { type: tool_used, any: [save_room_file] }
  why: A form a teammate posted in a thread has to be fetched from the room before it can be filled and stamped; the AI used to ask the person to download it.

- id: SAVE-01
  title: A summary with no place named goes to My files
  features: [rooms.messages, files.edit]
  lang: ko
  context: personal
  as: sora
  prompt: leads 대화방 내용 회의록으로 요약해서 파일로 저장해줘
  expect:
    outcome: do
    good: "Reads the leads group chat, writes the summary as a file in her own folder (My files), says where it is, and says who can open it only as the save's result says (only her), never \"everyone in the room\". Does not put it in Company-wide (shared/) or a department folder on its own, and does not ask where first."
    checks:
      - { type: file_created, file: "users/sora/**" }
      - { type: no_file_created, file: "shared/**" }
      - { type: no_file_created, file: "groups/**" }
  variants:
    - key: named
      prompt: leads 대화방 내용 회의록으로 요약해서 전사 공유 회의록 폴더에 저장해줘
      expect:
        outcome: do
        good: "Saves it in the company-wide meeting-notes folder she named, after the card that says where it came from (the leads chat, 3 people) and how many people can see that folder; says who can open it as the save's result says."
        checks:
          - { type: file_created, file: "shared/**" }
    - key: room-side
      context: room-side
      prompt: 이 방 대화 회의록으로 요약해서 파일로 저장해줘
      expect:
        outcome: do
        good: "Reads this room (라마바카페 건: sora, daniel, minho) and saves the notes at the room's save place (the department folder all three share, or her own folder followed by a share with daniel and minho), not in Company-wide; does not ask where first. Says who can open the file exactly as the save's (and any share's) result says, never \"everyone in the room\" unless that result says all of the room's people can open it."
        checks:
          - { type: no_file_created, file: "shared/**" }
  why: QA TC-4792 (MAN-026/027) — a 3-person room's notes went to Company-wide (10 people) and the answer said everyone in the room could open them (docs/decisions/20261117-ai-save-my-files-default.md).
