- id: SKL-12
  title: A quote takes the next free number
  features: [skills.list, files.edit]
  lang: ko
  context: personal
  as: hana
  prompt: quick-quote 스킬로 바나 상사 견적서 하나 만들어줘. A4 복사용지 10박스, 단가 27,000원.
  followUps:
    - 아 바나 상사 수량 12박스로 고쳐줘. 같은 견적서 수정이야.
  reply: 네, 그렇게 해주세요.
  expect:
    outcome: do
    good: "Her quotes folder already holds today's Q-<today>-01 (다라 치과의원). The new 바나 상사 quote gets the next free number, Q-<today>-02, never -01 again; the earlier -01 file is left as it is. The revision to 12 boxes keeps -02 (the same file updated, or a revised copy still numbered -02), never a new -03. Saying the 10-box version stays in the file's version history is true (an overwritten file keeps its earlier versions)."
    checks:
      - { type: file_created, file: "users/hana/견적/Q-*-02*" }
      - { type: no_file_created, file: "users/hana/견적/Q-*-01*" }
      - { type: no_file_created, file: "users/hana/견적/Q-*-03*" }
  why: "TC-4550: on qa three quotes made with a skill that showed Q-YYYYMMDD-01 were all -01 in the same folder (the AI copied the example). Fixed by the running-number line in every skill block (chat/prompt.ts RUNNING_NUMBER_RULE, docs/decisions/20261117-quote-next-number.md). The -01 file is made at every `up` (fixture/seed.ts), so it carries today's date."

