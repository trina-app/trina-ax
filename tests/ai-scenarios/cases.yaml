      expect: { outcome: do, good: Two smaller copies., checks: [{ type: file_created, file: "groups/마케팅/**/*.{jpg,jpeg,png,webp}" }] }
    # iPhone photos (HEIC): the copy is a JPEG and the AI says so; the photo's details (time, camera, location) stay unless asked
    - key: heic
      prompt: 마케팅 사진 폴더에 있는 이 아이폰 사진들 크기 줄여줘
      expect:
        outcome: do
        good: Makes two smaller JPEG copies of IMG_3001.HEIC and IMG_3002.HEIC and says the copies are JPEG files (the originals stay). Does NOT say the location was removed or that details were stripped, because nobody asked. No technical words (EXIF, tool names).
        checks:
          - { type: tool_used, any: [resize_images] }
          - { type: image, file: "groups/마케팅/사진/*.{jpg,jpeg}", count: 2, format: jpeg, maxWidth: 2999, gps: kept, details: kept }
          - { type: answer_matches, pattern: "JPEG|JPG|제이펙" }
          - { type: answer_not_matches, pattern: "위치.{0,12}(제거|삭제|뺐|뺀|지웠|없앴|없애|빼고)" }
    - key: heic-location
      prompt: 마케팅 행사 폴더에 있는 이 아이폰 사진 위치 정보 빼고 줄여줘
      expect:
        outcome: do
        good: Makes one smaller JPEG copy of IMG_3003.HEIC without the location (the time and camera may stay), and says plainly that the location was removed and that the copy is a JPEG. No technical words.
        checks:
          - { type: tool_used, any: [resize_images] }
          - { type: image, file: "groups/마케팅/행사/*.{jpg,jpeg}", count: 1, format: jpeg, maxWidth: 2999, gps: removed, details: kept }
          - { type: answer_matches, pattern: "위치" }

