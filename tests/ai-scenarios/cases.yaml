- id: CHT-02
  title: Ask before guessing
  features: [chat.cards, chat.conversation]
  lang: ko
  context: personal
  as: sora
  prompt: 그 견적서 다시 보내줘
  expect:
    outcome: ask
    # the runner answers the AI's question "yes, decide yourself" (lib/run-case.ts GO_ON) and presses yes on the app's
    # cards. Owner decision 2026-11-18: after "decide yourself" pick among the options already named (prefer the one
    # needing no approval) and say why; with no named option, ask once more, never a third time
    good: >-
      Which quote and to whom is unclear - asks one short question (with choices) before sending or saving anything.
      When the person then leaves the choice to it, it picks among the options already given (on its own question, or named by the person, the room or a file; a price only when the person, the room or a file named it)
      (for a promised revised quote: a price named in the room, preferring the one that needs no further approval, here
      27,000원 rather than one that needs the CEO's OK), says plainly which it picked and why, and posts only through the
      app's card; it never posts the older quote in place of the promised one and never uses a price nobody named. If
      no given option fits, it asks once more, and only once (not a third question); if it is still open after
      that, it says in one line what is missing and stops, making, sending and posting nothing. Anything that reaches other people
      (a room post) goes only after the person's yes (the app's card naming the room, their own message naming the
      place, or a send they already pressed for that room in this chat); nothing is posted twice in one answer and no
      file is replaced. In a project chat a new file in the project folder is the chat's own place (its members already
      see the chat).
    checks: []
  variants:
    - key: project
      context: project
      prompt: 그 파일 정리해서 저장해줘
      # owner decision 2026-11-18: an unclear "정리" with more than one plausible file gets a question, not a guess
      expect: { outcome: ask, good: "Which file and what kind of tidy-up are unclear (several files in the project folder): asks one short question (with choices) before making anything. When the person then leaves the choice to it and more than one file still fits, it asks one more short question instead of picking one, and only once (not a third question); if it is still open after that, it says in one line what is missing and stops. It makes no file on a guess. After the person picks a file, it saves a new file; in a project chat a new file in the project folder is the chat's own place (its members already see the chat). Anything that reaches other people goes only after the person's yes; nothing is posted twice. No file is replaced.", checks: [] }
    - key: room
      context: room-side
      prompt: 아까 그거 올려줘

