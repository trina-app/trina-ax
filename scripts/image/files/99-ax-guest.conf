# Team AX tenant guest sysctls (isolation.md §5.2). Named 99-… so it wins over the kit's 60-mycel.conf
# (ptrace_scope = 1 for self-host): the hosted template uses 2. Unprivileged user namespaces stay ON (bwrap needs them;
# Debian allows them by default).
kernel.yama.ptrace_scope = 2
kernel.unprivileged_bpf_disabled = 1
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
