# Team AX tenant (isolation.md §4.7): the only time sources are the platform's own. Proxmox: the host (10.200.0.1).
# EC2: Amazon Time Sync (169.254.169.123, link-local, not filtered by NACLs or security groups). Each one is
# unreachable on the other platform; chrony uses the one that answers. kvm-clock does the rest.
server 10.200.0.1 iburst
server 169.254.169.123 iburst
driftfile /var/lib/chrony/chrony.drift
makestep 1 3
rtcsync
leapsectz right/UTC
logdir /var/log/chrony
