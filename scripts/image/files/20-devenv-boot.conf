# Installed as /etc/systemd/system/mycel-server.service.d/20-devenv-boot.conf by scripts/image/customize.sh (images
# with srt only): before the server starts, mycel-devenv-boot.service puts the dev environment on srt in place from
# plan.json (docs/research/srt-hosted-boot.md). Wants, not Requires: a failure there never stops the server.
[Unit]
Wants=mycel-devenv-boot.service mycel-devenv-plan.path
After=mycel-devenv-boot.service
