# Team AX tenant template (isolation.md §5.2–5.4). The only input is the cloud-config of ax-hostd: write_files
# (/run/ax/enroll.json, and on EC2 /etc/ax/link.json) + runcmd (start mycel-link and mycel-enroll). On Proxmox it comes
# on the NoCloud drive (the tenant network blocks 169.254.169.254). On EC2 and Oracle it comes from the instance
# metadata service (IMDSv2, hop limit 1; the kit firewall keeps the server and engine accounts away from it). ds-identify
# picks Ec2 or Oracle only when the platform says so (DMI). No users, no SSH, and cloud-init is disabled after
# enrollment (/etc/cloud/cloud-init.disabled, written by mycel-enroll).
datasource_list: [ NoCloud, Ec2, Oracle, None ]
disable_root: true
ssh_pwauth: false
ssh_deletekeys: true
ssh_genkeytypes: []
users: []
manage_etc_hosts: false
preserve_hostname: false
cloud_init_modules:
  - seed_random
  - bootcmd
  - write_files
  - growpart
  - resizefs
  - set_hostname
  - update_hostname
cloud_config_modules:
  - runcmd
cloud_final_modules:
  - scripts_per_once
  - scripts_per_boot
  - scripts_per_instance
  - scripts_user
  - final_message
