# Team AX tenant template (isolation.md §5.2–5.4). The only input is ax-hostd's NoCloud snippet on the Proxmox
# cloud-init drive: write_files (/run/ax/enroll.json) + runcmd (start mycel-enroll). No users, no SSH, no metadata
# services (the tenant network blocks 169.254.169.254 anyway), and cloud-init is disabled after enrollment
# (/etc/cloud/cloud-init.disabled, written by mycel-enroll).
datasource_list: [ NoCloud, None ]
disable_root: true
ssh_pwauth: false
ssh_deletekeys: true
ssh_genkeytypes: []
users: []
manage_etc_hosts: false
preserve_hostname: false
cloud_init_modules:
  - seed_random
  - bootcmd
  - write_files
  - growpart
  - resizefs
  - set_hostname
  - update_hostname
cloud_config_modules:
  - runcmd
cloud_final_modules:
  - scripts_per_once
  - scripts_per_boot
  - scripts_per_instance
  - scripts_user
  - final_message
