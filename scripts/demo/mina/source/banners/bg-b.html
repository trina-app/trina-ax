<!doctype html>
<!-- The "Higgsfield" background of version B, drawn in CSS (no credits spent): a deep tea-green table scene in soft
     window light, yuzu slices and leaves out of focus, a little steam. No text. -->
<html lang="ko"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 628px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 60% 70% at 78% 30%, rgba(255, 214, 140, .30), transparent 60%),
      radial-gradient(ellipse 90% 80% at 20% 110%, #0f2a1f 0%, transparent 70%),
      linear-gradient(160deg, #2c624a 0%, #1F4D3A 45%, #143426 100%);
  }
  .table { position: absolute; left: -10%; right: -10%; bottom: -160px; height: 300px; border-radius: 50%;
    background: radial-gradient(ellipse at 60% 20%, #3b5a3f 0%, #1d3a2a 60%, #10261b 100%); filter: blur(2px); opacity: .9; }
  .bokeh { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 190, .55), rgba(255, 236, 190, 0) 70%); }
  .yuzu { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, #fff1bf 0 8%, transparent 9%), repeating-conic-gradient(#f5c341 0deg 25deg, #fff3cc 25deg 30deg), #f5c341;
    box-shadow: 0 0 0 6px #fdf3d6, 0 0 0 11px #e9a92a, 0 18px 30px rgba(0,0,0,.35); }
  .leaf { position: absolute; width: 120px; height: 52px; border-radius: 0 100% 0 100%; background: linear-gradient(135deg, #5f9b6c, #2f6b48); box-shadow: 0 12px 20px rgba(0,0,0,.3); }
  .steam { position: absolute; width: 40px; height: 220px; border-radius: 50%; border-left: 10px solid rgba(255,255,255,.18); filter: blur(7px); }
  .grain { position: absolute; inset: 0; opacity: .07;
    background-image: repeating-radial-gradient(circle at 17% 32%, #fff 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 71% 64%, #000 0 1px, transparent 1px 4px); }
</style></head>
<body>
  <div class="bokeh" style="left:640px;top:-40px;width:260px;height:260px"></div>
  <div class="bokeh" style="left:900px;top:60px;width:180px;height:180px;opacity:.7"></div>
  <div class="bokeh" style="left:1040px;top:-30px;width:220px;height:220px;opacity:.5"></div>
  <div class="bokeh" style="left:520px;top:80px;width:120px;height:120px;opacity:.4"></div>
  <div class="table"></div>
  <div class="steam" style="left:880px;top:70px;transform:rotate(8deg)"></div>
  <div class="steam" style="left:930px;top:40px;transform:rotate(-6deg) scaleX(-1)"></div>
  <div class="yuzu" style="left:1050px;top:470px;width:150px;height:150px;filter:blur(1.5px)"></div>
  <div class="yuzu" style="left:600px;top:500px;width:110px;height:110px;filter:blur(3px);opacity:.85"></div>
  <div class="yuzu" style="left:1110px;top:150px;width:90px;height:90px;filter:blur(5px);opacity:.7"></div>
  <div class="yuzu" style="left:-30px;top:520px;width:120px;height:120px;filter:blur(6px);opacity:.55"></div>
  <div class="leaf" style="left:980px;top:420px;transform:rotate(-24deg)"></div>
  <div class="leaf" style="left:680px;top:560px;transform:rotate(12deg);filter:blur(2px)"></div>
  <div class="leaf" style="left:1100px;top:330px;transform:rotate(60deg) scale(.8);filter:blur(3px)"></div>
  <div class="grain"></div>
</body></html>
