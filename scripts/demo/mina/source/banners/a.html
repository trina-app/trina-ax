<!doctype html>
<!-- Version A: the brand guide applied. One big title, then the line, the yuzu badge (the one accent), the button;
     logo top left at 48px; Pretendard only; the product large on the right. -->
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="product.css">
<style>
  body { background: #F6F1E7; font-family: Pretendard, sans-serif; color: #1B1F1C; }
  .logo { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 30px; color: #1F4D3A; letter-spacing: -.02em; }
  .logo i { width: 26px; height: 26px; border-radius: 0 100% 0 100%; background: #1F4D3A; transform: rotate(0deg); display: block; }
  .copy { position: absolute; left: 64px; top: 150px; width: 640px; }
  .eyebrow { font-size: 22px; font-weight: 600; color: #1F4D3A; letter-spacing: .02em; }
  h1 { margin-top: 14px; font-size: 104px; line-height: 1.04; font-weight: 800; letter-spacing: -.045em; color: #1F4D3A; }
  .sub { margin-top: 22px; font-size: 26px; line-height: 1.45; color: #3a443d; }
  .row { margin-top: 30px; display: flex; align-items: center; gap: 18px; }
  .badge { background: #F2B630; color: #1B1F1C; font-weight: 800; font-size: 24px; padding: 13px 22px; border-radius: 999px; }
  .badge span { font-weight: 600; opacity: .8; margin-left: 8px; font-size: 21px; }
  .btn { color: #1F4D3A; font-weight: 700; font-size: 23px; border-bottom: 2px solid #1F4D3A; padding-bottom: 3px; }
  .disc { position: absolute; right: -60px; top: 40px; width: 600px; height: 600px; border-radius: 50%; background: #E7E5D6; }
  .product { right: 70px; top: 150px; transform: scale(1.12); transform-origin: top right; }
</style></head>
<body>
  <div class="disc"></div>
  <div class="logo"><i></i>차곡</div>
  <div class="copy">
    <div class="eyebrow">겨울 한정 · 11월 23일 출시</div>
    <h1>겨울엔,<br>유자생강</h1>
    <p class="sub">찬물에 넣어 두면 끝. 따뜻하게 우려도 좋아요.</p>
    <div class="row"><div class="badge">출시 기념 20%<span>11.23 – 12.6</span></div><div class="btn">지금 만나보기 →</div></div>
  </div>
  <div class="product">
    <div class="pouch"><div class="label"><div class="brand">차곡</div><div class="kind">COLD BREW TEA</div><div class="yuzu yuzu-mini"></div><div class="name">유자생강</div><div class="count">10개입</div></div></div>
    <div class="glass"><div class="bag"></div><div class="tag"></div><div class="yuzu slice"></div></div>
  </div>
</body></html>
