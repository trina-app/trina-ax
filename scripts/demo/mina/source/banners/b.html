<!doctype html>
<!-- Version B: version A's layout on the new background (assets/bg-b.png), the words in cream so they read on green. -->
<html lang="{{lang}}"><head><meta charset="utf-8"><link rel="stylesheet" href="product.css">
<style>
  body { background: #1F4D3A url(../../assets/bg-b.png) center / cover no-repeat; font-family: Pretendard, sans-serif; color: #F6F1E7; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12, 32, 23, .55) 0%, rgba(12, 32, 23, .25) 45%, rgba(12, 32, 23, 0) 65%); }
  .logo { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 30px; color: #F6F1E7; letter-spacing: -.02em; }
  .logo i { width: 26px; height: 26px; border-radius: 0 100% 0 100%; background: #F6F1E7; transform: rotate(0deg); display: block; }
  .copy { position: absolute; left: 64px; top: 150px; width: 640px; }
  .eyebrow { font-size: 22px; font-weight: 600; color: #F6F1E7; opacity: .85; letter-spacing: .02em; }
  h1 { margin-top: 14px; font-size: 104px; line-height: 1.04; font-weight: 800; letter-spacing: -.045em; color: #F6F1E7; text-shadow: 0 4px 24px rgba(0,0,0,.25); }
  .sub { margin-top: 22px; font-size: 26px; line-height: 1.45; color: #F6F1E7; opacity: .92; }
  .row { margin-top: 30px; display: flex; align-items: center; gap: 18px; }
  .badge { background: #F2B630; color: #1B1F1C; font-weight: 800; font-size: 24px; padding: 13px 22px; border-radius: 999px; }
  .badge span { font-weight: 600; opacity: .8; margin-left: 8px; font-size: 21px; }
  .btn { color: #F6F1E7; font-weight: 700; font-size: 23px; border-bottom: 2px solid #F6F1E7; padding-bottom: 3px; }
  .product { right: 70px; top: 150px; transform: scale(1.12); transform-origin: top right; }
  .pouch { box-shadow: 0 0 0 2px rgba(246,241,231,.35), 0 28px 44px rgba(0, 0, 0, .45); }
</style></head>
<body>
  <div class="shade"></div>
  <div class="logo"><i></i>{{brand}}</div>
  <div class="copy">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <p class="sub">{{sub}}</p>
    <div class="row"><div class="badge">{{badge}}<span>{{badgeDates}}</span></div><div class="btn">{{cta}}</div></div>
  </div>
  <div class="product">
    <div class="pouch"><div class="label"><div class="brand">{{brand}}</div><div class="kind">{{pouchKind}}</div><div class="yuzu yuzu-mini"></div><div class="name">{{pouchName}}</div><div class="count">{{pouchCount}}</div></div></div>
    <div class="glass"><div class="bag"></div><div class="tag"></div><div class="yuzu slice"></div></div>
  </div>
</body></html>
