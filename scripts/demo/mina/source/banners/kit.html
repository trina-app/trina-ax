<!doctype html>
<!-- The Instagram square (1080×1080) and story (1080×1920) of versions A and B, in the banners' design: class
     "a" = cream with the leaf-green title, "b" = the "Higgsfield" scene (drawn here in CSS, as in bg-b.html) with
     cream words. render.mjs fills {{format}} (square | story), {{theme}} (a | b), {{w}}, {{h}} and the copy. -->
<html lang="{{lang}}"><head><meta charset="utf-8"><link rel="stylesheet" href="product.css">
<style>
  html, body { width: {{w}}px; height: {{h}}px; overflow: hidden; }
  body { font-family: Pretendard, sans-serif; position: relative; }
  .a { background: #F6F1E7; color: #1F4D3A; }
  .b { color: #F6F1E7;
    background:
      radial-gradient(ellipse 70% 50% at 75% 22%, rgba(255, 214, 140, .30), transparent 60%),
      radial-gradient(ellipse 90% 60% at 20% 105%, #0f2a1f 0%, transparent 70%),
      linear-gradient(160deg, #2c624a 0%, #1F4D3A 45%, #143426 100%); }
  .deco { position: absolute; inset: 0; overflow: hidden; }
  .a .deco .scene { display: none; }
  .b .deco .disc { display: none; }
  .disc { position: absolute; border-radius: 50%; background: #E7E5D6; }
  .bokeh { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255, 236, 190, .5), rgba(255, 236, 190, 0) 70%); }
  .yz { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, #fff1bf 0 8%, transparent 9%), repeating-conic-gradient(#f5c341 0deg 25deg, #fff3cc 25deg 30deg), #f5c341;
    box-shadow: 0 0 0 7px #fdf3d6, 0 0 0 13px #e9a92a, 0 18px 30px rgba(0,0,0,.35); }
  .leaf { position: absolute; width: 150px; height: 64px; border-radius: 0 100% 0 100%; background: linear-gradient(135deg, #5f9b6c, #2f6b48); box-shadow: 0 12px 20px rgba(0,0,0,.3); }
  .grain { position: absolute; inset: 0; opacity: .06;
    background-image: repeating-radial-gradient(circle at 17% 32%, #fff 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 71% 64%, #000 0 1px, transparent 1px 4px); }

  .logo { position: absolute; left: 80px; top: 76px; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 40px; letter-spacing: -.02em; }
  .logo i { width: 34px; height: 34px; border-radius: 0 100% 0 100%; background: currentColor; display: block; }
  .copy { position: absolute; left: 80px; right: 80px; }
  .eyebrow { font-size: 30px; font-weight: 600; opacity: .9; }
  h1 { margin-top: 18px; font-weight: 800; letter-spacing: -.045em; line-height: 1.02; }
  .b h1 { text-shadow: 0 4px 24px rgba(0,0,0,.25); }
  .sub { margin-top: 24px; font-size: 36px; line-height: 1.4; opacity: .92; }
  .a .sub { color: #3a443d; }
  .row { display: flex; align-items: center; gap: 26px; }
  .badge { background: #F2B630; color: #1B1F1C; font-weight: 800; font-size: 34px; padding: 18px 30px; border-radius: 999px; white-space: nowrap; }
  .badge span { font-weight: 600; opacity: .8; margin-left: 10px; font-size: 29px; }
  .btn { font-weight: 700; font-size: 32px; border-bottom: 3px solid currentColor; padding-bottom: 4px; white-space: nowrap; }
  .b .pouch { box-shadow: 0 0 0 2px rgba(246,241,231,.35), 0 28px 44px rgba(0, 0, 0, .45); }

  /* square: title top left, product bottom right, badge bottom left */
  .square .copy { top: 190px; }
  .square .sub { max-width: 420px; }
  .story .yz.c { top: 47% !important; }
  .square h1 { font-size: 136px; }
  .square .row { position: absolute; left: 80px; bottom: 84px; flex-direction: column; align-items: flex-start; gap: 22px; }
  .square .product { right: 30px; bottom: 50px; transform: scale(1.15); transform-origin: bottom right; }
  .square .disc { right: -160px; bottom: -200px; width: 760px; height: 760px; }

  /* story: logo, title in the top third, product big in the middle, badge and the call at the bottom */
  .story .logo { top: 120px; }
  .story .copy { top: 300px; }
  .story h1 { font-size: 168px; }
  .story .product { left: 50%; top: 900px; transform: translateX(-50%) scale(1.75); transform-origin: top center; }
  .story .row { position: absolute; left: 80px; right: 80px; bottom: 150px; flex-direction: column; gap: 34px; }
  .story .badge { font-size: 42px; padding: 22px 40px; }
  .story .badge span { font-size: 36px; }
  .story .btn { font-size: 36px; }
  .story .disc { left: 50%; top: 860px; width: 980px; height: 980px; transform: translateX(-50%); }
</style></head>
<body class="{{theme}} {{format}}">
  <div class="deco">
    <div class="disc"></div>
    <div class="scene">
      <div class="bokeh" style="left:52%;top:-4%;width:46%;height:26%"></div>
      <div class="bokeh" style="left:78%;top:8%;width:30%;height:18%;opacity:.7"></div>
      <div class="bokeh" style="left:5%;top:40%;width:22%;height:14%;opacity:.35"></div>
      <div class="yz" style="left:84%;top:84%;width:220px;height:220px;filter:blur(2px)"></div>
      <div class="yz" style="left:-6%;top:88%;width:180px;height:180px;filter:blur(6px);opacity:.6"></div>
      <div class="yz c" style="left:88%;top:30%;width:120px;height:120px;filter:blur(5px);opacity:.7"></div>
      <div class="leaf" style="left:74%;top:78%;transform:rotate(-24deg)"></div>
      <div class="leaf" style="left:8%;top:72%;transform:rotate(14deg);filter:blur(3px)"></div>
      <div class="grain"></div>
    </div>
  </div>
  <div class="logo"><i></i>{{brand}}</div>
  <div class="copy">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
    <p class="sub">{{sub}}</p>
  </div>
  <div class="product">
    <div class="pouch"><div class="label"><div class="brand">{{brand}}</div><div class="kind">{{pouchKind}}</div><div class="yuzu yuzu-mini"></div><div class="name">{{pouchName}}</div><div class="count">{{pouchCount}}</div></div></div>
    <div class="glass"><div class="bag"></div><div class="tag"></div><div class="yuzu slice"></div></div>
  </div>
  <div class="row"><div class="badge">{{badge}}<span>{{badgeDates}}</span></div><div class="btn">{{cta}}</div></div>
</body></html>
