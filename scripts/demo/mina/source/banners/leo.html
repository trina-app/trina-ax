<!doctype html>
<!-- 레오's first draft: readable, but every line is the same size, pastel colours off the brand, red sale text, the
     logo small in the corner, the product squeezed under the text. Mediocre on purpose, not a joke. -->
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="product.css">
<style>
  body { background: linear-gradient(120deg, #bfe1f2 0%, #e3d9f2 50%, #f6c9da 100%); font-family: 'Apple SD Gothic Neo', sans-serif; color: #33415c; }
  .text { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
  .text p { line-height: 1.5; }
  .l1 { font-size: 46px; font-weight: 700; color: #2d3a66; }
  .l2 { font-size: 34px; font-weight: 600; margin-top: 10px; }
  .l3 { font-size: 36px; font-weight: 700; color: #e0384b; margin-top: 18px; }
  .l4 { font-size: 30px; font-weight: 500; margin-top: 6px; }
  .l5 { font-size: 30px; font-weight: 500; margin-top: 6px; color: #5a6a8a; }
  .logo { position: absolute; right: 26px; bottom: 18px; font-size: 18px; font-weight: 600; color: #7a86a3; letter-spacing: .02em; }
  .product { left: 26px; top: 360px; transform: scale(.55); transform-origin: top left; opacity: .95; }
  .star { position: absolute; font-size: 40px; color: #fff; opacity: .8; }
</style></head>
<body>
  <div class="star" style="left:120px;top:60px">✦</div>
  <div class="star" style="right:150px;top:110px">✦</div>
  <div class="star" style="right:240px;bottom:90px;font-size:28px">✦</div>
  <div class="product">
    <div class="pouch"><div class="label"><div class="brand">차곡</div><div class="kind">COLD BREW TEA</div><div class="yuzu yuzu-mini"></div><div class="name">유자생강</div><div class="count">10개입</div></div></div>
    <div class="glass"><div class="bag"></div><div class="tag"></div><div class="yuzu slice"></div></div>
  </div>
  <div class="text">
    <p class="l1">차곡 겨울 신제품 출시 안내</p>
    <p class="l2">유자생강 콜드브루 티 블렌드가 새로 나왔습니다</p>
    <p class="l3">출시 기념 20% 할인 이벤트 진행중!!</p>
    <p class="l4">기간 : 11/23 ~ 12/6</p>
    <p class="l5">지금 바로 구매하세요~</p>
  </div>
  <div class="logo">chagok tea</div>
</body></html>
