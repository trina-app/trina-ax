<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- The desktop app's icon (Trina edition): the macOS icon grid (an 824 px tile with 184 px corners on a 1024 px canvas),
     the tile's warm-black gradient and light edge, and the mark of web/public/favicon.svg at 0.82 of the tile, as in the
     web app's Dock icon (web/scripts/make-icons.ts FULL_BLEED_MARK). Render:
     rsvg-convert -w 1024 -h 1024 desktop/scripts/trina-icon.svg -o desktop/build-resources/icon.png -->
