#!/usr/sbin/nft -f
# Relay VM firewall (control-plane 3.6.1): 443 only from Cloudflare (sets filled by cf-ips-refresh.sh), ssh and the
# private listener (8090: operator API, metrics) only over Tailscale. Everything else in is dropped. Outbound is open
# (Tailscale, Litestream to R2, apt). Install as /etc/nftables.conf; cf-ips-refresh.sh keeps the sets current.
flush ruleset

table inet mycel_relay {
  # Cloudflare's published ranges (https://www.cloudflare.com/ips-v4, /ips-v6), checked 2026-10-21; refreshed weekly
  set cf_v4 {
    type ipv4_addr; flags interval
    elements = { 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
                 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13,
                 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22 }
  }
  set cf_v6 {
    type ipv6_addr; flags interval
    elements = { 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32 }
  }

  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } accept
    iifname "tailscale0" tcp dport { 22, 8090 } accept
    tcp dport 443 ip saddr @cf_v4 accept
    tcp dport 443 ip6 saddr @cf_v6 accept
    # Tailscale's own UDP port (direct connections; it also works through DERP without it)
    udp dport 41641 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
