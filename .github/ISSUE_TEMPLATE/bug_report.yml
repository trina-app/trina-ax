name: Something is not working / 잘 안 돼요
description: Tell us what you tried and what happened. / 하려던 일과 실제 결과를 알려 주세요.
body:
  - type: markdown
    attributes:
      value: |
        English / 한국어 welcome. Use fictional data only. / 가상 자료만 사용하세요.
        Never include names, customer files, keys, tokens, cookies, private links or raw logs.
        실명·고객 자료·키·토큰·쿠키·비공개 링크·원본 로그를 올리지 마세요.
        Security reports / 보안 신고: contact@trina.app privately.
  - type: dropdown
    id: role
    attributes:
      label: Your role / 맡은 역할
      options:
        - Team member / 팀원
        - Admin / 관리자
        - Owner or team lead / 소유자·팀장
        - Unsure / 잘 모르겠어요
  - type: dropdown
    id: hosting
    attributes:
      label: Where you use Trina / 사용 방식
      options:
        - Trina hosting / 트리나 호스팅
        - Our own server / 회사 서버
        - Local demo / 로컬 체험
        - Unsure / 잘 모르겠어요
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do? / 어떤 일을 하려고 했나요?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened? / 실제로 무슨 일이 일어났나요?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / 무엇을 기대했나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps with invented data / 가상 자료로 재현하는 순서
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version in Settings → About, if known / 설정 → 정보 버전, 알면 적어 주세요
    validations:
      required: false
  - type: textarea
    id: device
    attributes:
      label: Browser or device, if relevant / 관련 있을 때 브라우저·기기
    validations:
      required: false
