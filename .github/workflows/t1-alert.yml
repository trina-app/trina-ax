# T1 alert: keeps ONE open issue "T1 attack suite red on dev" while the Linux attack suite (T1, ci.yml's linux-docker
# job, amd64 and arm64) is red on a push to dev, and closes it when T1 passes on a later dev push.
# The Linux jobs run on a push to dev only (not in a pull request, not in the merge queue), so a red one blocks nobody
# until a release; on 2026-11-18/19 T1 stayed red about 4 hours unnoticed and held up 0.5.17.
#
# Its own workflow after CI (workflow_run), not a job in ci.yml: release.yml and msstore.yml call ci.yml with
# `contents: read` only, and a called workflow may not ask for more than its caller grants. A job with `issues: write`
# in ci.yml made GitHub refuse the whole release run (v0.5.19, startup_failure). ci.yml needs `contents: read` only;
# tests/unit/workflow-permissions.test.ts keeps it so.
#
# workflow_run always runs this file as it is on the default branch (main), whatever branch CI ran on: a change here
# takes effect only once it reaches main (the next release). `branches: [dev]` filters on the CI run's head branch,
# so github.ref here is main's ref and never says which branch CI ran on; the job reads the CI run instead
# (github.event.workflow_run). Only the default token: issues write, actions read (the CI run's jobs and logs).
name: T1 alert

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: read
  issues: write

# one at a time, in order: two runs at once could each open an issue
concurrency:
  group: t1-alert
  cancel-in-progress: false

jobs:
  t1-alert:
    name: T1 alert (issue "T1 attack suite red on dev")
    # a push to dev in this repository only: a pull request (also from a fork whose branch is named dev) and a queued
    # entry (gh-readonly-queue/dev/…) never run T1; a cancelled run (a newer push to dev) says nothing about T1
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -u
          title="T1 attack suite red on dev"
          short="${SHA:0:8}"

          # the T1 legs (amd64, arm64) of this CI run attempt: id, name, conclusion, first failed step
          legs=$(mktemp)
          gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.name | startswith("Linux attack suite")) | [.id, .name, (.conclusion // ""), ([.steps[]? | select(.conclusion == "failure" or .conclusion == "timed_out") | .name][0] // "")] | @tsv' > "$legs"
          total=$(( $(wc -l < "$legs") ))
          red=$(( $(awk -F'\t' '$3 == "failure" || $3 == "timed_out"' "$legs" | wc -l) ))
          green=$(( $(awk -F'\t' '$3 == "success"' "$legs" | wc -l) ))
          echo "T1 legs: $total, red: $red, green: $green"
          if [ "$red" -eq 0 ] && { [ "$total" -eq 0 ] || [ "$green" -ne "$total" ]; }; then
            echo "T1 did not run to the end in this run (skipped or cancelled); nothing to say"
            exit 0
          fi

          number=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")

          if [ "$red" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" -R "$REPO" --comment "T1 is green again on dev at \`$short\` ($RUN_URL). Closing."
              echo "closed #$number"
            else
              echo "T1 passed; no open issue"
            fi
            exit 0
          fi

          # the failed legs and their FAIL lines (job logs are readable once a job has finished)
          body=$(mktemp)
          {
            echo "T1 (Linux attack suite) failed on a push to dev."
            echo
            echo "- Commit: \`$SHA\`"
            echo "- Run: $RUN_URL"
            echo "- Releases wait for this: the release test run calls the same jobs."
          } > "$body"
          awk -F'\t' '$3 == "failure" || $3 == "timed_out"' "$legs" |
          while IFS=$'\t' read -r id name _conclusion step; do
            {
              echo
              echo "### $name"
              [ -n "$step" ] && echo "Failed step: $step"
              echo
              echo '```'
              gh api "repos/$REPO/actions/jobs/$id/logs" 2>/dev/null | sed 's/^[0-9T:.Z-]* //; s/```//g' | grep -a 'FAIL' | head -30 || true
              echo '```'
              echo "Job log: https://github.com/$REPO/actions/runs/$RUN_ID/job/$id"
            } >> "$body"
          done

          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body-file "$body"
            echo "commented on #$number"
          else
            gh issue create -R "$REPO" --title "$title" --body-file "$body"
          fi
          echo "::error title=T1 attack suite is red on dev::$RUN_URL"
          exit 1
