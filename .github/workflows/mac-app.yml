# The Mac app people download (docs/RELEASE-CI.md "Mac app"): the dmg, signed with the Developer ID Application
# certificate, hardened runtime, notarized by Apple and stapled, so it opens with no "unidentified developer" warning;
# with it the update zip and latest-mac.yml that the desks' Mac apps update from (through their team server, like the
# Windows app). release.yml calls this for every release tag (job build-mac-app) and publishes what it uploads
# (artifact release-mac); "Run workflow" here builds and checks the same files from any branch or tag and publishes
# nothing (the artifact is kept 3 days).
#
# Secrets (repository secrets, docs/RELEASE-CI.md "Mac app"): MAC_DEVELOPER_ID_P12_BASE64 (the certificate and its key,
# .p12 as base64), MAC_DEVELOPER_ID_P12_PASSWORD, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8 (the App
# Store Connect API key notarytool uses). Only the steps that use them see them; the keychain and the key file live
# under $RUNNER_TEMP and are removed whatever happens.
name: Mac app

on:
  workflow_call:
    inputs:
      ref:
        description: the commit to build
        required: true
        type: string
      version:
        description: the app's version (the release's)
        required: true
        type: string
      runner:
        description: the macOS runner (empty = the repository variable RELEASE_MAC_RUNNER when release.yml calls this at a v* tag, else macos-15)
        required: false
        default: ""
        type: string
      retention-days:
        required: false
        default: 7
        type: number
    # a called workflow sees only the secrets it declares (release.yml passes these five)
    secrets:
      MAC_DEVELOPER_ID_P12_BASE64:
        required: true
      MAC_DEVELOPER_ID_P12_PASSWORD:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER_ID:
        required: true
      APPLE_API_KEY_P8:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "The version written into the app (e.g. 0.5.5-test.1); nothing is published"
        required: true
        type: string
      runner:
        description: "The hosted macOS runner; empty = macos-15 (macos-15-intel when the arm64 pool has no capacity)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.3.12

jobs:
  build:
    name: Mac app (dmg, Developer ID, notarized)
    # the same pool as the office zip (release.yml build-office); macos-15-intel builds the same universal app.
    # RELEASE_MAC_RUNNER (which may name the self-hosted release Mac, docs/RELEASE-CI.md 13) applies only when release.yml
    # at a v* tag called this (github.workflow_ref is the caller's); "Run workflow" here falls back to macos-15
    runs-on: ${{ inputs.runner || (startsWith(github.workflow_ref, 'trina-app/trina-ax/.github/workflows/release.yml@refs/tags/v') && vars.RELEASE_MAC_RUNNER) || 'macos-15' }}
    # Apple's notarization takes the most: two submissions (the app, then the dmg) took 25-35 minutes each on
    # 2026-11-15, the whole job 65-72 minutes
    timeout-minutes: 150
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # the self-hosted release Mac (docs/RELEASE-CI.md 13) takes only release.yml at a v* tag of this repository (tag
      # push or Run workflow with the tag); its job-started hook checks the same on the host before any step
      - name: Release Mac runner guard
        if: runner.environment == 'self-hosted'
        env:
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          refuse() { echo "::error::the self-hosted release Mac runs only release.yml at a v* tag of trina-app/trina-ax: $*"; exit 1; }
          [ "$REPO" = trina-app/trina-ax ] || refuse "repository $REPO"
          [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ] || refuse "event $EVENT"
          [[ "$REF" == refs/tags/v* ]] || refuse "ref $REF"
          [[ "$WORKFLOW_REF" == "trina-app/trina-ax/.github/workflows/release.yml@refs/tags/v"* ]] || refuse "workflow $WORKFLOW_REF"
      - name: The version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,6}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+){0,3})?$ ]]; then echo "::error::version $VERSION is not like 0.5.5 or 0.5.5-beta.1"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # a keychain of this job only, first in the search list (electron-builder's own temporary keychain from CSC_LINK
      # cannot set the key's partition list on current macOS: "SecKeychainUnlock … passphrase … not correct")
      - name: Signing keychain (the Developer ID certificate from the secret, never printed)
        env:
          P12: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then echo "::error::secrets MAC_DEVELOPER_ID_P12_BASE64 / MAC_DEVELOPER_ID_P12_PASSWORD are not set (docs/RELEASE-CI.md \"Mac app\")"; exit 1; fi
          umask 077
          kc="$RUNNER_TEMP/devid.keychain-db"
          pw=$(openssl rand -base64 32)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          # -x: the private key cannot be exported from the keychain (not even by a build step); only codesign may use it
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$P12_PASSWORD" -x -T /usr/bin/codesign > /dev/null
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q '"Developer ID Application: Trina Inc. (YWW96288YY)"' || { echo "::error::the .p12 holds no Developer ID Application identity of team YWW96288YY"; exit 1; }
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: App Store Connect API key for notarytool (from the secret, never printed)
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$P8" ]; then echo "::error::secret APPLE_API_KEY_P8 is not set (docs/RELEASE-CI.md \"Mac app\")"; exit 1; fi
          umask 077
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarize the app (dmg + update zip + latest-mac.yml)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          bun run --cwd desktop dist:mac:release -- "-c.extraMetadata.version=$VERSION"
          bun scripts/plugins/release-check.ts desktop/dist
          grep -qx "version: $VERSION" desktop/release/latest-mac.yml
      - name: Notarize and staple the dmg; Gatekeeper checks
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          bun scripts/release/mac-app.ts desktop/release
          ls -l desktop/release
      - name: Remove the keychain and the key
        if: always()
        run: |
          if [ -n "$CSC_KEYCHAIN" ]; then security delete-keychain "$CSC_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/devid.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mac
          path: |
            desktop/release/*-mac-universal.dmg
            desktop/release/*-mac-universal.zip
            desktop/release/latest-mac.yml
          if-no-files-found: error
          overwrite: true # a re-run of the job replaces its own artifact
          # release.yml passes 7; "Run workflow" here passes none (3 days). Not github.event_name: in a called workflow
          # that is the caller's event (a release started by hand)
          retention-days: ${{ inputs.retention-days || 3 }}
