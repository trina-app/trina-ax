# Nightly: the full CI once a day on `dev`, then main follows.
# Pull requests go to `dev` and merge without waiting for CI (docs/REPOSITORY-RULES.md "브랜치와 CI").
# At 03:00 KST this workflow pins dev's head, runs ci.yml on exactly that commit, and when every job passes it
# fast-forwards main to it. When a job fails, main stays where it is and the fix goes to dev for the next night.
# "Run workflow" on the Actions tab does the same at once (an urgent promotion).
name: Nightly

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pin:
    name: Pin dev's head
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - id: pin
        env:
          REPO: ${{ github.repository }}
        run: |
          sha=$(git ls-remote "https://github.com/${REPO}.git" refs/heads/dev | cut -f1)
          [ -n "$sha" ] || { echo "::error::no dev branch"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "dev is at $sha" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: CI on dev
    needs: pin
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.pin.outputs.sha }}

  promote:
    name: Fast-forward main
    needs: [pin, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: main → the tested dev commit (fast-forward only)
        env:
          SHA: ${{ needs.pin.outputs.sha }}
        run: |
          git fetch origin "$SHA"
          main=$(git rev-parse origin/main)
          if [ "$main" = "$SHA" ]; then echo "main is already at $SHA" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if ! git merge-base --is-ancestor "$main" "$SHA"; then
            echo "::error::main ($main) is not an ancestor of dev ($SHA): merge main into dev, then run Nightly again"
            exit 1
          fi
          # GITHUB_TOKEN cannot push commits that change .github/workflows: such a night needs a person's push
          git push origin "$SHA:refs/heads/main" || {
            echo "::error::push refused (a workflow file changed?): run git push origin $SHA:refs/heads/main from a maintainer's machine"
            exit 1
          }
          echo "main fast-forwarded to $SHA" >> "$GITHUB_STEP_SUMMARY"
