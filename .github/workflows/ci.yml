# CI: typecheck (incl. web + desktop; the phone app in its own job), native build, unit tests (in 6 shards at once:
# scripts/ci/unit-shard.ts), fast fuzz, web tests + build, relay suite, and the Linux job with unprivileged accounts in Docker.
# Real-engine tests (Claude Code / Codex logins, model calls) never run here: they need the owner's accounts and
# run locally with `bun run test:stage1`.
# The release workflow (release.yml) calls this one with the tagged commit (`ref`) and publishes only when every job
# passes. No secret is used here: a call never passes any (no `secrets: inherit`).
name: CI

on:
  push:
    # dev too: the Linux jobs below (attack suite, release bundle, install test) run on every merge to dev, not on a
    # pull request's every push. On the GitHub Free plan the org runs at most 20 jobs at once, and a pull request's run
    # had 14; with these six left out a pull request needs 9 (2026-11-10, jobs waited up to 30 min in the queue).
    # A push to dev cancels the run of the push before it (concurrency below), so a burst of merges tests the last one.
    branches: [main, dev]
  # dev has a merge queue (docs/decisions/20261117-merge-queue.md): a pull request to dev runs the quick jobs only
  # (what changed, typecheck/docs/native, the phone app); the queue runs everything on each queued entry (merge_group,
  # the PR on top of dev and of the entries ahead of it). The required check "typecheck, native, unit, fast fuzz, web,
  # relay" reports on both. The whole suite on a pull request's branch on demand: `gh workflow run ci.yml --ref <branch>`
  # (workflow_dispatch, mode full; its required check lands on the branch's head commit, the PR's head). No label
  # trigger: any label would cancel and restart the PR's run and flash a red required check.
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: the commit to test (release.yml passes the tagged commit)
        type: string
        required: true

concurrency:
  # a called run (release.yml, msstore.yml) has its own group per calling workflow: a push to main never cancels it, and
  # a store package's tests never cancel the release's tests of the same commit (github.workflow is the caller's name).
  # A pull request: refs/pull/<n>/merge, so a new push stops that PR's older run. A queued entry (merge_group):
  # refs/heads/gh-readonly-queue/dev/pr-<n>-<sha>, one ref per entry, so entries never cancel each other; a rebuilt
  # entry gets a new ref of its own.
  group: ci-${{ inputs.ref && format('call-{0}-{1}', github.workflow, inputs.ref) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.12
  # Go that builds the native programs, exactly (versions.json "go"; docs/RELEASE-CI.md "Go 버전"): a newer patch
  # changes the root programs' bytes, and every Linux release would then need the root update (needsRoot)
  GO_VERSION: 1.27.3
  GOTOOLCHAIN: local
  PANDOC_VERSION: 3.9.0.2

jobs:
  # A pull request or queued entry that changes only Markdown directly in docs/, docs/decisions/ or changes/ (decisions,
  # fragments) runs the doc checks alone (docs job below), not the ~10 minutes of builds and tests: those files reach no
  # build. Otherwise `mode` (docs/decisions/20261117-merge-queue.md) picks the jobs:
  #   quick   a pull request to dev while the repository variable MERGE_QUEUE is "on" (set it only after dev's ruleset
  #           has the merge queue rule; unset it first to turn the queue off): typecheck, docs, native (+ the phone app
  #           job); the unit shards, "fast fuzz, web" and the relay suite are skipped (the merge queue runs them).
  #   tested  the push to dev made by the merge queue (actor github-merge-queue[bot]): the queue fast-forwards dev to
  #           the entry's commit it has just tested, so this SHA passed every job already; only the Linux jobs run.
  #   full    everything else: a queued entry (merge_group), a pull request to main (main's ruleset needs the check),
  #           any other push to dev (an admin merge past the queue) or main, a manual run (`gh workflow run ci.yml
  #           --ref <branch>`), a release's call.
  # The required check (check job) passes on each path only when the jobs of that path passed.
  scope:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      mode: ${{ steps.diff.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          # pull_request: the PR's merge commit and its first parent (the base): their difference is what the PR changes.
          # merge_group: the entry's commit; its parent is fetched below (a diff of two commits needs only their trees)
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          BASE_REF: ${{ github.base_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          CALLED: ${{ inputs.ref != '' && inputs.ref != null }}
          MERGE_QUEUE: ${{ vars.MERGE_QUEUE }}
        run: |
          docs_only=false
          files=""
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          elif [ "$EVENT" = merge_group ]; then
            # merge_group.base_sha is the entry's PARENT: the entry ahead of it in the queue (dev only for the first
            # entry), so this is what this one pull request adds. The docs-only shortcut is safe only because dev's
            # queue is ALLGREEN (every entry must pass its own checks); with HEADGREEN a failing code entry followed by
            # a docs-only one could land on doc checks alone (docs/decisions/20261117-merge-queue.md).
            # (a failed fetch only costs the docs-only shortcut: the entry runs everything)
            if git fetch --no-tags --depth=1 origin "$GROUP_BASE"; then files=$(git diff --name-only "$GROUP_BASE" HEAD)
            else echo "::warning::could not fetch the entry's parent $GROUP_BASE; running every job"; fi
          fi
          if [ -n "$files" ]; then
            echo "$files"
            if ! printf '%s\n' "$files" | grep -Ev '^(docs|docs/decisions|changes)/[^/]+\.md$' > /dev/null; then docs_only=true; fi
          fi
          mode=full
          if [ "$CALLED" = true ]; then
            mode=full
          elif [ "$EVENT" = pull_request ] && [ "$BASE_REF" = dev ] && [ "$MERGE_QUEUE" = on ]; then
            mode=quick
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/dev ] && [ "$ACTOR" = 'github-merge-queue[bot]' ]; then
            mode=tested
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: docs only
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run features:check
      - run: bun run check:docs

  # The unit tests took ~30 of the ~35 minutes of one job. They now run as 6 jobs at once
  # (scripts/ci/unit-shard.ts spreads the files by their earlier times), beside the static checks and the
  # fast fuzz / web job; none of them waits for another (all need only `scope`). 6 shards: ~7 minutes of tests each.
  # A queued entry still runs 10 jobs, as with 5 shards: its phone app typecheck runs at the end of this job instead of
  # in its own job (the queue builds 4 entries at once on the org's 20 runners; docs/decisions/20261117-faster-full-run.md). Each job sets up the same tools as before. The last job keeps the old job's name, the
  # check the default branch's ruleset requires: it passes only when every job above it passed.
  static:
    # relay: the relay suite runs here in full mode (skipped on a pull request's quick run)
    name: typecheck, docs, native, relay
    needs: scope
    # every mode but `tested` (the queue's own push to dev: this commit passed it as a queued entry)
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.mode != 'tested'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/go.sum
      # downloads kept between runs: pandoc's package (by version) and bun's package store (by bun.lock). A run with a
      # cache does not reach GitHub releases or the npm registry for them; a miss downloads as before.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ci-pandoc
          key: pandoc-${{ runner.os }}-${{ env.PANDOC_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - name: Tools (ripgrep, poppler, pandoc ${{ env.PANDOC_VERSION }})
        run: |
          # GitHub's runners sometimes cannot resolve the Ubuntu mirrors for a while ("Temporary failure resolving
          # 'azure.archive.ubuntu.com'", 2026-11-11): try the package step again before failing the job
          # the runner image's Microsoft apt source answered 403 (2026-11-27) and failed the apt index update; every package here is Ubuntu's
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          for try in 1 2 3 4 5; do
            sudo timeout -k 10 120 apt-get -o Acquire::Retries=3 update && sudo timeout -k 10 120 apt-get -o Acquire::Retries=3 install -y --no-install-recommends ripgrep poppler-utils bubblewrap libfontconfig1 && break
            [ "$try" = 5 ] && exit 1
            echo "::warning::apt failed (try $try of 5); trying again in $((try * 20)) s"; sleep $((try * 20))
          done
          deb="$HOME/.cache/ci-pandoc/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          if [ ! -s "$deb" ]; then
            mkdir -p "$(dirname "$deb")"
            curl -fsSL --retry 5 --retry-all-errors -o "$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          fi
          sudo dpkg -i "$deb"
          rg --version | head -1; pandoc --version | head -1; pdftotext -v 2>&1 | head -1
      - name: Enable and smoke-test converter isolation
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces. Use the installer's
          # bwrap-only AppArmor allowance; keep the global restriction enabled.
          # Probe network isolation too: --unshare-user alone can miss loopback failures.
          if ! bwrap --unshare-all --ro-bind / / true &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            for try in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends apparmor && break; [ "$try" = 5 ] && exit 1; sleep $((try * 20)); done
            sed 's/@ID@/mycel-ci/g' scripts/linux/apparmor-bwrap.in | sudo tee /etc/apparmor.d/mycel-ci-bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/mycel-ci-bwrap
          fi
          bwrap --unshare-all --ro-bind / / true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # every API endpoint and web screen belongs to a feature of docs/features.ts (docs/FEATURES.md); a second or two
      - name: Feature map
        run: bun run features:check
      - name: Onboarding documentation contracts
        run: bun run check:docs
      # two migrations with one number stop the server at start; on a pull request a new number must also be above
      # the base branch's highest of its component (the base is fetched the way changelog:check fetches it)
      - name: Migration numbers
        run: bun run check:migrations
      - name: Native build (darwin + linux, amd64 + arm64), go vet and go test
        run: |
          ARCHS="amd64 arm64" bash native/build.sh
          # go test covers the seccomp filter (errnos on a child), the Landlock probe, the bwrap argv golden, the
          # nft rule golden, plan / firewall-status parsing, the bundle verifier and the launcher symlink fix
          cd native && go vet ./... && go test ./...
          # the test binary is the sandboxed helper: with cgo it is dynamic and TestExecNetProxy (QA TC-309) skips, so
          # run the package again static like the release build (-v: the log shows it ran, not skipped)
          CGO_ENABLED=0 go test -count=1 -v ./cmd/mycel-sandbox/
      # the repo-wide guard tests (scripts/ci/guard-tests.ts, the same list as check:prepush), on every pull request too:
      # a new route without a matrix case, a text missing in a language or a new tool not in the exact lists shows on
      # the pull request's quick checks instead of a merge queue cycle later (about a minute; after the native build: the
      # tool-list tests start a server that needs native/bin)
      - name: Guard tests (route coverage, i18n, tool lists, registries)
        run: bun scripts/ci/guard-tests.ts
      - name: Pinned browser against Chrome for Testing Stable
        timeout-minutes: 2
        run: bun scripts/system/browser-staleness.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-bin
          # The uncleared HWP runtime is for local CI execution only, not redistribution.
          path: |
            native/bin/
            !native/bin/hwp/**
          retention-days: 7
      # Node last in the job, so it never changes the steps above. Full mode only: the relay suite (moved here from
      # "fast fuzz, web", which then has room for more) and, on a queued entry, the phone app typecheck.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.scope.outputs.mode == 'full'
        with:
          # the production relay's runtime (versions.json node-relay; relay/deploy/install-node.sh pins the tarball)
          node-version: 26.12.1
          # npm's download cache only where the phone app is installed here (a queued entry)
          cache: ${{ github.event_name == 'merge_group' && 'npm' || '' }}
          cache-dependency-path: mobile/package-lock.json
      - name: Relay conformance and hardening (real Node 26 relay)
        if: needs.scope.outputs.mode == 'full'
        run: bun run test:relay
      # the free-roam demo gate (demo-gate/): a real Node gate with fake instances, a fake model API and Turnstile
      - name: Demo gate suite (real Node 26 gate)
        if: needs.scope.outputs.mode == 'full'
        run: bun run test:demo-gate
      # a queued entry (merge_group): the phone app typecheck of the mobile job below, here instead of a job of its own,
      # so the entry runs 10 jobs with 6 unit shards. The same steps. (The mobile job keeps its name everywhere else:
      # main's ruleset requires "Mobile app typecheck".)
      # advisory, as the mobile job was on a queued entry (dev does not require it): a failure shows on the step and in
      # the run's annotations but does not fail this job
      - name: Phone app install (locked, no install scripts; only an unreachable registry skips the typecheck)
        id: mobile-install
        if: github.event_name == 'merge_group'
        continue-on-error: true
        run: bash mobile/scripts/ci-install.sh
      - name: Phone app typecheck
        if: github.event_name == 'merge_group' && steps.mobile-install.outputs.installed == 'true'
        continue-on-error: true
        run: npm --prefix mobile run typecheck

  unit:
    name: unit tests (${{ matrix.shard }}/6)
    needs: scope
    # mode full only: skipped on a pull request to dev (the merge queue runs it) and on the queue's push to dev
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      # every shard runs to the end: one failing shard does not hide another's failures
      fail-fast: false
      matrix:
        # the count is also in the job name and the test step below, and in tests/unit/ci-unit-shard.test.ts SHARDS
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/go.sum
      # downloads kept between runs: pandoc's package (by version) and bun's package store (by bun.lock). A run with a
      # cache does not reach GitHub releases or the npm registry for them; a miss downloads as before.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ci-pandoc
          key: pandoc-${{ runner.os }}-${{ env.PANDOC_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - name: Tools (ripgrep, poppler, pandoc ${{ env.PANDOC_VERSION }})
        run: |
          # GitHub's runners sometimes cannot resolve the Ubuntu mirrors for a while ("Temporary failure resolving
          # 'azure.archive.ubuntu.com'", 2026-11-11): try the package step again before failing the job
          # the runner image's Microsoft apt source answered 403 (2026-11-27) and failed the apt index update; every package here is Ubuntu's
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          for try in 1 2 3 4 5; do
            sudo timeout -k 10 120 apt-get -o Acquire::Retries=3 update && sudo timeout -k 10 120 apt-get -o Acquire::Retries=3 install -y --no-install-recommends ripgrep poppler-utils bubblewrap libfontconfig1 && break
            [ "$try" = 5 ] && exit 1
            echo "::warning::apt failed (try $try of 5); trying again in $((try * 20)) s"; sleep $((try * 20))
          done
          deb="$HOME/.cache/ci-pandoc/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          if [ ! -s "$deb" ]; then
            mkdir -p "$(dirname "$deb")"
            curl -fsSL --retry 5 --retry-all-errors -o "$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          fi
          sudo dpkg -i "$deb"
          rg --version | head -1; pandoc --version | head -1; pdftotext -v 2>&1 | head -1
      - name: Enable and smoke-test converter isolation
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces. Use the installer's
          # bwrap-only AppArmor allowance; keep the global restriction enabled.
          # Probe network isolation too: --unshare-user alone can miss loopback failures.
          if ! bwrap --unshare-all --ro-bind / / true &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            for try in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends apparmor && break; [ "$try" = 5 ] && exit 1; sleep $((try * 20)); done
            sed 's/@ID@/mycel-ci/g' scripts/linux/apparmor-bwrap.in | sudo tee /etc/apparmor.d/mycel-ci-bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/mycel-ci-bwrap
          fi
          bwrap --unshare-all --ro-bind / / true
      - run: bun install --frozen-lockfile
      # the native programs kept between runs, keyed on native/ (its Go sources, go.sum and build.sh) and the Go version:
      # the build is reproducible (-trimpath, -buildvcs=false), so the same key means the same bytes. ~45 s per job on
      # a hit. The static job always builds them and runs go vet / go test.
      # restore only here; the save below runs on a push (main, or a push to dev past the queue). A queued entry reads
      # main's caches and its own ref's, which nothing reads again, so it never saves (the repo's 10 GB of caches).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: native-cache
        with:
          path: |
            native/bin/darwin-amd64
            native/bin/darwin-arm64
            native/bin/linux-amd64
            native/bin/linux-arm64
          key: native-bin-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('native/**') }}
      - name: Native build (darwin + linux, amd64 + arm64)
        env:
          HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: |
          # a hit must hold every program (5 per darwin arch, 9 per linux arch); anything less builds them again
          n=$(find native/bin/darwin-amd64 native/bin/darwin-arm64 native/bin/linux-amd64 native/bin/linux-arm64 -type f 2>/dev/null | wc -l)
          if [ "$HIT" = true ] && [ "$n" -ge 28 ]; then echo "native programs from the cache ($n files)"; exit 0; fi
          ARCHS="amd64 arm64" bash native/build.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && steps.native-cache.outputs.cache-hit != 'true'
        # several jobs of one run may try; the first saves, the others only warn
        continue-on-error: true
        with:
          path: |
            native/bin/darwin-amd64
            native/bin/darwin-arm64
            native/bin/linux-amd64
            native/bin/linux-arm64
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      # the pinned rhwp CLI (prepare:hwp checks its sha256 and downloads it only when missing or different)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native/bin/hwp
          key: rhwp-${{ runner.os }}-${{ hashFiles('resources/hwp/manifest.json') }}
      - name: Pinned Hangul renderer
        run: bun run prepare:hwp
      # tests/unit and tests/security (TC-3846: the security suite never ran in CI before); files a Linux runner cannot
      # run are listed with their reason in scripts/ci/unit-shard.ts CI_SKIPPED and printed here
      - name: Unit + security tests, shard ${{ matrix.shard }} of 6
        run: bun scripts/ci/unit-shard.ts ${{ matrix.shard }} 6

  other:
    name: fast fuzz, web
    needs: scope
    # mode full only, like the unit shards
    if: needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/go.sum
      # downloads kept between runs: pandoc's package (by version) and bun's package store (by bun.lock). A run with a
      # cache does not reach GitHub releases or the npm registry for them; a miss downloads as before.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ci-pandoc
          key: pandoc-${{ runner.os }}-${{ env.PANDOC_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - name: Tools (ripgrep, poppler, pandoc ${{ env.PANDOC_VERSION }})
        run: |
          # GitHub's runners sometimes cannot resolve the Ubuntu mirrors for a while ("Temporary failure resolving
          # 'azure.archive.ubuntu.com'", 2026-11-11): try the package step again before failing the job
          # the runner image's Microsoft apt source answered 403 (2026-11-27) and failed the apt index update; every package here is Ubuntu's
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          for try in 1 2 3 4 5; do
            sudo timeout -k 10 120 apt-get -o Acquire::Retries=3 update && sudo timeout -k 10 120 apt-get -o Acquire::Retries=3 install -y --no-install-recommends ripgrep poppler-utils bubblewrap libfontconfig1 && break
            [ "$try" = 5 ] && exit 1
            echo "::warning::apt failed (try $try of 5); trying again in $((try * 20)) s"; sleep $((try * 20))
          done
          deb="$HOME/.cache/ci-pandoc/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          if [ ! -s "$deb" ]; then
            mkdir -p "$(dirname "$deb")"
            curl -fsSL --retry 5 --retry-all-errors -o "$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          fi
          sudo dpkg -i "$deb"
          rg --version | head -1; pandoc --version | head -1; pdftotext -v 2>&1 | head -1
      - name: Enable and smoke-test converter isolation
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces. Use the installer's
          # bwrap-only AppArmor allowance; keep the global restriction enabled.
          # Probe network isolation too: --unshare-user alone can miss loopback failures.
          if ! bwrap --unshare-all --ro-bind / / true &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            for try in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends apparmor && break; [ "$try" = 5 ] && exit 1; sleep $((try * 20)); done
            sed 's/@ID@/mycel-ci/g' scripts/linux/apparmor-bwrap.in | sudo tee /etc/apparmor.d/mycel-ci-bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/mycel-ci-bwrap
          fi
          bwrap --unshare-all --ro-bind / / true
      - run: bun install --frozen-lockfile
      # the native programs kept between runs, keyed on native/ (its Go sources, go.sum and build.sh) and the Go version:
      # the build is reproducible (-trimpath, -buildvcs=false), so the same key means the same bytes. ~45 s per job on
      # a hit. The static job always builds them and runs go vet / go test.
      # restore only here; the save below runs on a push (main, or a push to dev past the queue). A queued entry reads
      # main's caches and its own ref's, which nothing reads again, so it never saves (the repo's 10 GB of caches).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: native-cache
        with:
          path: |
            native/bin/darwin-amd64
            native/bin/darwin-arm64
            native/bin/linux-amd64
            native/bin/linux-arm64
          key: native-bin-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('native/**') }}
      - name: Native build (darwin + linux, amd64 + arm64)
        env:
          HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: |
          # a hit must hold every program (5 per darwin arch, 9 per linux arch); anything less builds them again
          n=$(find native/bin/darwin-amd64 native/bin/darwin-arm64 native/bin/linux-amd64 native/bin/linux-arm64 -type f 2>/dev/null | wc -l)
          if [ "$HIT" = true ] && [ "$n" -ge 28 ]; then echo "native programs from the cache ($n files)"; exit 0; fi
          ARCHS="amd64 arm64" bash native/build.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && steps.native-cache.outputs.cache-hit != 'true'
        # several jobs of one run may try; the first saves, the others only warn
        continue-on-error: true
        with:
          path: |
            native/bin/darwin-amd64
            native/bin/darwin-arm64
            native/bin/linux-amd64
            native/bin/linux-arm64
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      # the pinned rhwp CLI (prepare:hwp checks its sha256 and downloads it only when missing or different)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native/bin/hwp
          key: rhwp-${{ runner.os }}-${{ hashFiles('resources/hwp/manifest.json') }}
      - name: Pinned Hangul renderer
        run: bun run prepare:hwp
      - name: Fast fuzz (path fuzzer in-process and over the socket, ReDoS)
        run: bun run test:fuzz:fast
      - name: Web unit tests and build
        run: |
          bun run test:web
          bun run build:web
          # the hands-on demo (web/demo/): its demo-only source transforms stop the build when the app's code they
          # match has moved; English at /demo/, every other language at /demo/<locale>/
          DEMO_BASE=/demo/ bun run --cwd web build:demo
          for l in ko id ja es zh; do DEMO_LOCALE=$l DEMO_BASE=/demo/$l/ DEMO_OUT=dist-demo-$l bun run --cwd web build:demo || exit 1; done
      # the relay suite runs in "typecheck, docs, native, relay" (full mode), which ends ~2 min before the unit shards;
      # the web browser tests' guard set runs in its own job (e2e-guard), so this job keeps its time

  e2e-guard:
    # ADVISORY: a guard set of the web browser tests (web/package.json e2e:guard; docs/RELEASE-CI.md "14.") on each
    # queued entry. Its own job and not in `check`'s needs, so nothing requires it: a red guard never holds up a queued
    # entry, and the required check ("typecheck, native, unit, fast fuzz, web, relay") is decided as before. To make it
    # required (after ~20 green queue runs), add it to `check`'s needs and its result to the check step. The summary
    # says pass/fail and lists the failed spec:line; a failure keeps the traces as an artifact.
    # Chromium, one worker (the mock team server holds shared state), against its own web build. A phone's font as in
    # feature-map.yml (Roboto as sans-serif and system-ui), so the specs that measure text against its box draw it as
    # a phone does. No native build, HWP renderer or pandoc: the guard specs need none of them.
    name: web e2e guard (advisory)
    needs: scope
    if: github.event_name == 'merge_group' && needs.scope.outputs.docs_only != 'true' && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    # install + web build ~3 min, the guard ~3.5 min (its step has its own 10-minute cap)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # read only: a queued entry's cache is saved under its own ref and never read again (the repo's 10 GB of caches)
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - name: Web build
        run: bun run build:web
      - name: Browser tests, guard set
        id: e2e-guard
        timeout-minutes: 10
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-guard.json
        run: |
          cd web
          # Chromium's system packages and the phone font through apt, tried again (the Ubuntu mirrors fail for a while)
          # the runner image's Microsoft apt source answered 403 (2026-11-27) and failed the apt index update; every package here is Ubuntu's
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          for try in 1 2 3 4 5; do
            bunx playwright install-deps chromium && sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends fonts-roboto-unhinted && break
            [ "$try" = 5 ] && exit 1
            echo "::warning::browser packages failed (try $try of 5); trying again in $((try * 20)) s"; sleep $((try * 20))
          done
          sudo install -m 644 test/e2e/fonts/phone-font.conf /etc/fonts/conf.d/99-mycel-e2e-phone-font.conf
          fc-cache -f
          # no browser cache: a merge_group cache is saved under its own ref and never read again (repo caches are full);
          # the Chromium download takes ~20 s
          bunx playwright install chromium
          bun run e2e:guard --reporter=line,json
      - name: Guard set in the run summary
        if: ${{ !cancelled() && steps.e2e-guard.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.e2e-guard.outcome }}
          REPORT: ${{ runner.temp }}/e2e-guard.json
        run: |
          if [ "$OUTCOME" = success ]; then echo "### Web e2e guard set (advisory): ✅ passed" >> "$GITHUB_STEP_SUMMARY"
          else echo "### Web e2e guard set (advisory): ❌ $OUTCOME (not a required check)" >> "$GITHUB_STEP_SUMMARY"; fi
          bun scripts/features/e2e-failures.ts "$REPORT" "guard set" >> "$GITHUB_STEP_SUMMARY"
      - name: Guard set traces (on failure)
        if: ${{ !cancelled() && steps.e2e-guard.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-guard-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  check:
    # the name the dev and main rulesets require (and release.yml's test needs): every job of this run's mode passed.
    # It runs on every event (always()), so the required name reports on a pull request, on a queued entry
    # (merge_group) and on a push alike; a merge queue entry with no report would wait until the queue's time-out.
    # Only the jobs above are in `needs`: the phone app, the Linux jobs and desktop.yml's macOS / Windows jobs are not
    # required on dev and never hold up a queued entry.
    name: typecheck, native, unit, fast fuzz, web, relay
    needs: [scope, docs, static, unit, other]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job of this mode passed
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          MODE: ${{ needs.scope.outputs.mode }}
          SCOPE: ${{ needs.scope.result }}
          DOCS: ${{ needs.docs.result }}
          STATIC: ${{ needs.static.result }}
          HEAVY: ${{ needs.unit.result }} ${{ needs.other.result }}
        run: |
          echo "scope: $SCOPE, mode: $MODE, docs only: $DOCS_ONLY, docs: $DOCS, static: $STATIC, unit + other: $HEAVY"
          [ "$SCOPE" = success ] || exit 1
          # docs only: the doc checks passed (the build and test jobs were skipped on purpose)
          if [ "$DOCS_ONLY" = true ]; then [ "$DOCS" = success ]; exit; fi
          case "$MODE" in
            # the queue's push to dev: the same commit passed every job as a queued entry
            tested) [ "$STATIC" = skipped ] || exit 1 ;;
            # a pull request to dev: typecheck, docs, native passed; the unit shards, fuzz/web and relay run in the queue
            quick) [ "$STATIC" = success ] || exit 1; for r in $HEAVY; do [ "$r" = skipped ] || exit 1; done ;;
            full) [ "$STATIC" = success ] || exit 1; for r in $HEAVY; do [ "$r" = success ] || exit 1; done ;;
            *) echo "unknown mode '$MODE'"; exit 1 ;;
          esac

  mobile:
    # The phone app (mobile/) has its own npm lockfile, and the root typecheck leaves it out. Its own job, so it never
    # delays the main one. npm's download cache is keyed on mobile/package-lock.json; the install retries, and only a
    # registry that stays unreachable warns and skips (mobile/scripts/ci-install.sh); a lockfile or integrity problem
    # and a type error fail the job.
    name: Mobile app typecheck
    # a queued entry runs these steps at the end of "typecheck, docs, native, relay" instead (one job fewer per entry)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # within React Native 0.88's range (mobile/README.md), the relay's Node like the check job
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install (locked, no install scripts; only an unreachable registry skips the typecheck)
        id: install
        run: bash mobile/scripts/ci-install.sh
      - name: Typecheck
        if: steps.install.outputs.installed == 'true'
        run: npm --prefix mobile run typecheck

  linux-docker:
    name: Linux attack suite (T1, bwrap + nftables + cgroups in Docker)
    # not on a pull request and not on a queued entry (not required on dev: a queued entry never waits on it): on the
    # push to dev, on main and in a release's test run (see `on:` above)
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # amd64 and arm64: the seccomp table, the whisper CPU pick and bwrap's behaviour differ by architecture.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/go.sum
      - name: Native build (linux ${{ matrix.arch }})
        run: ARCHS=${{ matrix.arch }} bash native/build.sh
      - name: Build and run the Docker job (T1)
        # tests/linux/run.ts runs the container --privileged --cgroupns=private (bwrap userns + mounts, nft
        # CAP_NET_ADMIN, a writable cgroup tree). GitHub's runners allow --privileged.
        run: bun run tests/linux/run.ts
      - name: Dev environment on srt, host like a team server (Debian 13, no AppArmor userns restriction)
        # srt runs bwrap as the server account (not root). Ubuntu 24.04 runners set
        # kernel.apparmor_restrict_unprivileged_userns=1: such a user namespace gets no capabilities, so bwrap stops at
        # "loopback: Failed RTM_NEWADDR: Operation not permitted" (--privileged does not change it; the sysctl is
        # global to the kernel). The dev environment on srt is for Debian 13 only (install-srt.sh refuses Ubuntu,
        # srt-dev-env.md spike S6), and Debian 13 has no such restriction. The sandbox settings stay the same.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo "USERNS_RESTRICT_BEFORE=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" >> "$GITHUB_ENV"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Dev environment on srt, attack suite (Docker debian:13, srt 0.0.81)
        # tests/linux/srt-run.ts: the srt settings of the runner hide the base folder, other projects and the server's
        # files; the network goes only through srt's proxy to allowed sites (needs network). --privileged for bwrap.
        # The suite first runs `true` through srt and stops if that fails, so a broken host cannot pass the attacks.
        run: bun run tests/linux/srt-run.ts
      - name: Host back to its value before the srt steps (Ubuntu default, AppArmor userns restriction on)
        if: always()
        run: |
          if [ -n "${USERNS_RESTRICT_BEFORE:-}" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$USERNS_RESTRICT_BEFORE"
          fi
      - name: Old version folders removed, roll-back still works (Docker debian:13)
        # tests/linux/prune-versions.ts: the server account stages four versions, the Linux bootstrap built above
        # confirms each one, then admin.js prune-versions and roll-back after the prune (no --privileged needed)
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun tests/linux/prune-versions.ts

  linux-bundle:
    name: Linux release bundle (L19) + verify-bundle
    # not on a pull request and not on a queued entry (not required on dev: a queued entry never waits on it): on the
    # push to dev, on main and in a release's test run (see `on:` above)
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: native/go.sum }
      # the pinned downloads of the bundle (bun, ripgrep, pandoc, typst, the Noto CJK fonts ...; scripts/linux/downloads.ts)
      # kept between runs. A cached file is checked against its SHA-256 every time; a miss downloads as before. Without
      # it every run fetched them from GitHub, and a GitHub outage (HTTP 504 three times on NotoSansCJK-Regular.ttc,
      # 2026-11-10) failed the job.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/cache
          key: linux-downloads-${{ matrix.arch }}-${{ hashFiles('scripts/linux/downloads.ts', 'versions.json') }}
          restore-keys: linux-downloads-${{ matrix.arch }}-
      - name: whisper-cli (static, this arch)
        run: bash scripts/linux/build-whisper.sh --arch ${{ matrix.arch }} --out dist/whisper
      - run: bun install --frozen-lockfile
      - name: Native build (linux ${{ matrix.arch }})
        run: ARCHS=${{ matrix.arch }} bash native/build.sh
      # the bundle carries the web app (web/dist); without it build-bundle warns and the kit has no app pages
      - run: bun run build:web
      - name: Build the Linux bundle and the install kit
        run: |
          V=$(bun -e 'console.log(require("./server/package.json").version)')-ci.${{ github.run_number }}
          bun scripts/build-bundle.ts --os linux --arch ${{ matrix.arch }} --version "$V" --whisper-dir dist/whisper --out dist/linux-${{ matrix.arch }}
      - name: verify-bundle and list the contents
        run: |
          V=$(cat dist/linux-${{ matrix.arch }}/VERSION)
          dist/linux-${{ matrix.arch }}/app/$V/root/mycel-ctl verify-bundle "dist/linux-${{ matrix.arch }}/app/$V" --allow-unsigned
          find "dist/linux-${{ matrix.arch }}/app/$V" -maxdepth 2 -printf '%P\n' | sort
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-kit-${{ matrix.arch }}
          # <kit>-<version>-linux-<arch>.tar.gz (build-bundle.ts kitName; the product name is not spelled out here, so a
          # rename cannot silently drop the artifact again) — the run fails when no kit matches
          path: dist/linux-${{ matrix.arch }}/*-server-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-install:
    name: Linux install test (T2, systemd on a VM runner)
    # not on a pull request and not on a queued entry (not required on dev: a queued entry never waits on it): on the
    # push to dev, on main and in a release's test run (see `on:` above)
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # paths filter and the daily schedule are enforced in the real feed; here the job just has to be correct.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: native/go.sum }
      - run: bun install --frozen-lockfile
      - name: Native build (linux ${{ matrix.arch }})
        run: ARCHS=${{ matrix.arch }} bash native/build.sh
      # the runner is a real VM: systemd, cgroup delegation and the Ubuntu 24.04 AppArmor userns restriction are
      # exercised for real (install-linux.sh step 4). The test builds its own kits (--no-whisper) and fake engine.
      - name: Install, units, firewall, turns, plan, updates, roll-back, uninstall, purge (T2)
        run: sudo env "PATH=$PATH" bun tests/install/g-linux-install.ts
