# CI: typecheck (incl. web + desktop; the phone app in its own job), native build, unit tests (in 5 shards at once:
# scripts/ci/unit-shard.ts), fast fuzz, web tests + build, relay suite, and the Linux job with unprivileged accounts in Docker.
# Real-engine tests (Claude Code / Codex logins, model calls) never run here: they need the owner's accounts and
# run locally with `bun run test:stage1`.
# The release workflow (release.yml) calls this one with the tagged commit (`ref`) and publishes only when every job
# passes. No secret is used here: a call never passes any (no `secrets: inherit`).
name: CI

on:
  push:
    # dev too: the Linux jobs below (attack suite, release bundle, install test) run on every merge to dev, not on a
    # pull request's every push. On the GitHub Free plan the org runs at most 20 jobs at once, and a pull request's run
    # had 14; with these six left out a pull request needs 9 (2026-11-10, jobs waited up to 30 min in the queue).
    # A push to dev cancels the run of the push before it (concurrency below), so a burst of merges tests the last one.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: the commit to test (release.yml passes the tagged commit)
        type: string
        required: true

concurrency:
  # a release's test run has its own group: a push to main never cancels it
  group: ci-${{ inputs.ref && format('release-{0}', inputs.ref) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.12
  # Go that builds the native programs, exactly (versions.json "go"; docs/RELEASE-CI.md "Go 버전"): a newer patch
  # changes the root programs' bytes, and every Linux release would then need the root update (needsRoot)
  GO_VERSION: 1.27.3
  GOTOOLCHAIN: local
  PANDOC_VERSION: 3.9.0.2

jobs:
  # The unit tests took ~30 of the ~35 minutes of one job. They now run as 5 jobs at once
  # (scripts/ci/unit-shard.ts spreads the files by their earlier times), beside the static checks and the
  # fuzz / web / relay job. Each job sets up the same tools as before. The last job keeps the old job's name, the
  # check the default branch's ruleset requires: it passes only when every job above it passed.
  static:
    name: typecheck, docs, native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/go.sum
      # downloads kept between runs: pandoc's package (by version) and bun's package store (by bun.lock). A run with a
      # cache does not reach GitHub releases or the npm registry for them; a miss downloads as before.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ci-pandoc
          key: pandoc-${{ runner.os }}-${{ env.PANDOC_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - name: Tools (ripgrep, poppler, pandoc ${{ env.PANDOC_VERSION }})
        run: |
          # GitHub's runners sometimes cannot resolve the Ubuntu mirrors for a while ("Temporary failure resolving
          # 'azure.archive.ubuntu.com'", 2026-11-11): try the package step again before failing the job
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ripgrep poppler-utils bubblewrap libfontconfig1 && break
            [ "$try" = 5 ] && exit 1
            echo "::warning::apt failed (try $try of 5); trying again in $((try * 20)) s"; sleep $((try * 20))
          done
          deb="$HOME/.cache/ci-pandoc/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          if [ ! -s "$deb" ]; then
            mkdir -p "$(dirname "$deb")"
            curl -fsSL --retry 5 --retry-all-errors -o "$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          fi
          sudo dpkg -i "$deb"
          rg --version | head -1; pandoc --version | head -1; pdftotext -v 2>&1 | head -1
      - name: Enable and smoke-test converter isolation
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces. Use the installer's
          # bwrap-only AppArmor allowance; keep the global restriction enabled.
          # Probe network isolation too: --unshare-user alone can miss loopback failures.
          if ! bwrap --unshare-all --ro-bind / / true &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            for try in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends apparmor && break; [ "$try" = 5 ] && exit 1; sleep $((try * 20)); done
            sed 's/@ID@/mycel-ci/g' scripts/linux/apparmor-bwrap.in | sudo tee /etc/apparmor.d/mycel-ci-bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/mycel-ci-bwrap
          fi
          bwrap --unshare-all --ro-bind / / true
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Onboarding documentation contracts
        run: bun run check:docs
      - name: Native build (darwin + linux, amd64 + arm64), go vet and go test
        run: |
          ARCHS="amd64 arm64" bash native/build.sh
          # go test covers the seccomp filter (errnos on a child), the Landlock probe, the bwrap argv golden, the
          # nft rule golden, plan / firewall-status parsing, the bundle verifier and the launcher symlink fix
          cd native && go vet ./... && go test ./...
      - name: Pinned browser against Chrome for Testing Stable
        timeout-minutes: 2
        run: bun scripts/system/browser-staleness.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-bin
          # The uncleared HWP runtime is for local CI execution only, not redistribution.
          path: |
            native/bin/
            !native/bin/hwp/**
          retention-days: 7

  unit:
    name: unit tests (${{ matrix.shard }}/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      # every shard runs to the end: one failing shard does not hide another's failures
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/go.sum
      # downloads kept between runs: pandoc's package (by version) and bun's package store (by bun.lock). A run with a
      # cache does not reach GitHub releases or the npm registry for them; a miss downloads as before.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ci-pandoc
          key: pandoc-${{ runner.os }}-${{ env.PANDOC_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - name: Tools (ripgrep, poppler, pandoc ${{ env.PANDOC_VERSION }})
        run: |
          # GitHub's runners sometimes cannot resolve the Ubuntu mirrors for a while ("Temporary failure resolving
          # 'azure.archive.ubuntu.com'", 2026-11-11): try the package step again before failing the job
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ripgrep poppler-utils bubblewrap libfontconfig1 && break
            [ "$try" = 5 ] && exit 1
            echo "::warning::apt failed (try $try of 5); trying again in $((try * 20)) s"; sleep $((try * 20))
          done
          deb="$HOME/.cache/ci-pandoc/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          if [ ! -s "$deb" ]; then
            mkdir -p "$(dirname "$deb")"
            curl -fsSL --retry 5 --retry-all-errors -o "$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          fi
          sudo dpkg -i "$deb"
          rg --version | head -1; pandoc --version | head -1; pdftotext -v 2>&1 | head -1
      - name: Enable and smoke-test converter isolation
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces. Use the installer's
          # bwrap-only AppArmor allowance; keep the global restriction enabled.
          # Probe network isolation too: --unshare-user alone can miss loopback failures.
          if ! bwrap --unshare-all --ro-bind / / true &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            for try in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends apparmor && break; [ "$try" = 5 ] && exit 1; sleep $((try * 20)); done
            sed 's/@ID@/mycel-ci/g' scripts/linux/apparmor-bwrap.in | sudo tee /etc/apparmor.d/mycel-ci-bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/mycel-ci-bwrap
          fi
          bwrap --unshare-all --ro-bind / / true
      - run: bun install --frozen-lockfile
      - name: Native build (darwin + linux, amd64 + arm64)
        run: ARCHS="amd64 arm64" bash native/build.sh
      # the pinned rhwp CLI (prepare:hwp checks its sha256 and downloads it only when missing or different)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native/bin/hwp
          key: rhwp-${{ runner.os }}-${{ hashFiles('resources/hwp/manifest.json') }}
      - name: Pinned Hangul renderer
        run: bun run prepare:hwp
      - name: Unit tests, shard ${{ matrix.shard }} of 5
        run: bun scripts/ci/unit-shard.ts ${{ matrix.shard }} 5

  other:
    name: fast fuzz, web, relay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/go.sum
      # downloads kept between runs: pandoc's package (by version) and bun's package store (by bun.lock). A run with a
      # cache does not reach GitHub releases or the npm registry for them; a miss downloads as before.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ci-pandoc
          key: pandoc-${{ runner.os }}-${{ env.PANDOC_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - name: Tools (ripgrep, poppler, pandoc ${{ env.PANDOC_VERSION }})
        run: |
          # GitHub's runners sometimes cannot resolve the Ubuntu mirrors for a while ("Temporary failure resolving
          # 'azure.archive.ubuntu.com'", 2026-11-11): try the package step again before failing the job
          for try in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ripgrep poppler-utils bubblewrap libfontconfig1 && break
            [ "$try" = 5 ] && exit 1
            echo "::warning::apt failed (try $try of 5); trying again in $((try * 20)) s"; sleep $((try * 20))
          done
          deb="$HOME/.cache/ci-pandoc/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          if [ ! -s "$deb" ]; then
            mkdir -p "$(dirname "$deb")"
            curl -fsSL --retry 5 --retry-all-errors -o "$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          fi
          sudo dpkg -i "$deb"
          rg --version | head -1; pandoc --version | head -1; pdftotext -v 2>&1 | head -1
      - name: Enable and smoke-test converter isolation
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces. Use the installer's
          # bwrap-only AppArmor allowance; keep the global restriction enabled.
          # Probe network isolation too: --unshare-user alone can miss loopback failures.
          if ! bwrap --unshare-all --ro-bind / / true &&
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            for try in 1 2 3 4 5; do sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends apparmor && break; [ "$try" = 5 ] && exit 1; sleep $((try * 20)); done
            sed 's/@ID@/mycel-ci/g' scripts/linux/apparmor-bwrap.in | sudo tee /etc/apparmor.d/mycel-ci-bwrap > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/mycel-ci-bwrap
          fi
          bwrap --unshare-all --ro-bind / / true
      - run: bun install --frozen-lockfile
      - name: Native build (darwin + linux, amd64 + arm64)
        run: ARCHS="amd64 arm64" bash native/build.sh
      # the pinned rhwp CLI (prepare:hwp checks its sha256 and downloads it only when missing or different)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native/bin/hwp
          key: rhwp-${{ runner.os }}-${{ hashFiles('resources/hwp/manifest.json') }}
      - name: Pinned Hangul renderer
        run: bun run prepare:hwp
      - name: Fast fuzz (path fuzzer in-process and over the socket, ReDoS)
        run: bun run test:fuzz:fast
      - name: Web unit tests and build
        run: |
          bun run test:web
          bun run build:web
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # the production relay's runtime (versions.json node-relay; relay/deploy/install-node.sh pins the tarball)
          node-version: 26.12.1
      - name: Relay conformance and hardening (real Node 26 relay)
        run: bun run test:relay

  check:
    # the name the default branch's ruleset requires (and release.yml's test needs): every job above passed
    name: typecheck, native, unit, fast fuzz, web, relay
    needs: [static, unit, other]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.unit.result }} ${{ needs.other.result }}
        run: |
          echo "static, unit, other: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  mobile:
    # The phone app (mobile/) has its own npm lockfile, and the root typecheck leaves it out. Its own job, so it never
    # delays the main one. npm's download cache is keyed on mobile/package-lock.json; the install retries, and only a
    # registry that stays unreachable warns and skips (mobile/scripts/ci-install.sh); a lockfile or integrity problem
    # and a type error fail the job.
    name: Mobile app typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # within React Native 0.88's range (mobile/README.md), the relay's Node like the check job
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install (locked, no install scripts; only an unreachable registry skips the typecheck)
        id: install
        run: bash mobile/scripts/ci-install.sh
      - name: Typecheck
        if: steps.install.outputs.installed == 'true'
        run: npm --prefix mobile run typecheck

  linux-docker:
    name: Linux attack suite (T1, bwrap + nftables + cgroups in Docker)
    # not on a pull request: on the merge to dev, on main and in a release's test run (see `on:` above)
    if: github.event_name != 'pull_request'
    # amd64 and arm64: the seccomp table, the whisper CPU pick and bwrap's behaviour differ by architecture.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: native/go.sum
      - name: Native build (linux ${{ matrix.arch }})
        run: ARCHS=${{ matrix.arch }} bash native/build.sh
      - name: Build and run the Docker job (T1)
        # tests/linux/run.ts runs the container --privileged --cgroupns=private (bwrap userns + mounts, nft
        # CAP_NET_ADMIN, a writable cgroup tree). GitHub's runners allow --privileged.
        run: bun run tests/linux/run.ts
      - name: Dev environment on srt, host like a team server (Debian 13, no AppArmor userns restriction)
        # srt runs bwrap as the server account (not root). Ubuntu 24.04 runners set
        # kernel.apparmor_restrict_unprivileged_userns=1: such a user namespace gets no capabilities, so bwrap stops at
        # "loopback: Failed RTM_NEWADDR: Operation not permitted" (--privileged does not change it; the sysctl is
        # global to the kernel). The dev environment on srt is for Debian 13 only (install-srt.sh refuses Ubuntu,
        # srt-dev-env.md spike S6), and Debian 13 has no such restriction. The sandbox settings stay the same.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo "USERNS_RESTRICT_BEFORE=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" >> "$GITHUB_ENV"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Dev environment on srt, attack suite (Docker debian:13, srt 0.0.81)
        # tests/linux/srt-run.ts: the srt settings of the runner hide the base folder, other projects and the server's
        # files; the network goes only through srt's proxy to allowed sites (needs network). --privileged for bwrap.
        # The suite first runs `true` through srt and stops if that fails, so a broken host cannot pass the attacks.
        run: bun run tests/linux/srt-run.ts
      - name: Host back to its value before the srt steps (Ubuntu default, AppArmor userns restriction on)
        if: always()
        run: |
          if [ -n "${USERNS_RESTRICT_BEFORE:-}" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$USERNS_RESTRICT_BEFORE"
          fi
      - name: Old version folders removed, roll-back still works (Docker debian:13)
        # tests/linux/prune-versions.ts: the server account stages four versions, the Linux bootstrap built above
        # confirms each one, then admin.js prune-versions and roll-back after the prune (no --privileged needed)
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun tests/linux/prune-versions.ts

  linux-bundle:
    name: Linux release bundle (L19) + verify-bundle
    # not on a pull request: on the merge to dev, on main and in a release's test run (see `on:` above)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: native/go.sum }
      # the pinned downloads of the bundle (bun, ripgrep, pandoc, typst, the Noto CJK fonts ...; scripts/linux/downloads.ts)
      # kept between runs. A cached file is checked against its SHA-256 every time; a miss downloads as before. Without
      # it every run fetched them from GitHub, and a GitHub outage (HTTP 504 three times on NotoSansCJK-Regular.ttc,
      # 2026-11-10) failed the job.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/cache
          key: linux-downloads-${{ matrix.arch }}-${{ hashFiles('scripts/linux/downloads.ts', 'versions.json') }}
          restore-keys: linux-downloads-${{ matrix.arch }}-
      - name: whisper-cli (static, this arch)
        run: bash scripts/linux/build-whisper.sh --arch ${{ matrix.arch }} --out dist/whisper
      - run: bun install --frozen-lockfile
      - name: Native build (linux ${{ matrix.arch }})
        run: ARCHS=${{ matrix.arch }} bash native/build.sh
      # the bundle carries the web app (web/dist); without it build-bundle warns and the kit has no app pages
      - run: bun run build:web
      - name: Build the Linux bundle and the install kit
        run: |
          V=$(bun -e 'console.log(require("./server/package.json").version)')-ci.${{ github.run_number }}
          bun scripts/build-bundle.ts --os linux --arch ${{ matrix.arch }} --version "$V" --whisper-dir dist/whisper --out dist/linux-${{ matrix.arch }}
      - name: verify-bundle and list the contents
        run: |
          V=$(cat dist/linux-${{ matrix.arch }}/VERSION)
          dist/linux-${{ matrix.arch }}/app/$V/root/mycel-ctl verify-bundle "dist/linux-${{ matrix.arch }}/app/$V" --allow-unsigned
          find "dist/linux-${{ matrix.arch }}/app/$V" -maxdepth 2 -printf '%P\n' | sort
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-kit-${{ matrix.arch }}
          # <kit>-<version>-linux-<arch>.tar.gz (build-bundle.ts kitName; the product name is not spelled out here, so a
          # rename cannot silently drop the artifact again) — the run fails when no kit matches
          path: dist/linux-${{ matrix.arch }}/*-server-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-install:
    name: Linux install test (T2, systemd on a VM runner)
    # not on a pull request: on the merge to dev, on main and in a release's test run (see `on:` above)
    if: github.event_name != 'pull_request'
    # paths filter and the daily schedule are enforced in the real feed; here the job just has to be correct.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # empty for push / pull_request (the default commit); the tagged commit when release.yml calls
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: native/go.sum }
      - run: bun install --frozen-lockfile
      - name: Native build (linux ${{ matrix.arch }})
        run: ARCHS=${{ matrix.arch }} bash native/build.sh
      # the runner is a real VM: systemd, cgroup delegation and the Ubuntu 24.04 AppArmor userns restriction are
      # exercised for real (install-linux.sh step 4). The test builds its own kits (--no-whisper) and fake engine.
      - name: Install, units, firewall, turns, plan, updates, roll-back, uninstall, purge (T2)
        run: sudo env "PATH=$PATH" bun tests/install/g-linux-install.ts
