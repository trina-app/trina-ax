# Dev build: every push to `dev` builds the Linux amd64 server bundle and publishes it for the dev test server.
#
#   build    the same steps as release.yml build-linux (amd64 only), with a dev version; no secrets, no token
#   publish  signs the update archive KEYLESS with Sigstore cosign (this workflow's OIDC identity on refs/heads/dev)
#            and pushes it to GHCR as an OCI artifact: ghcr.io/trina-app/trina-ax-dev:<short sha> and :latest
#
# The release key is never used here. The bundle has no manifest.sig: the dev test server (trina-ax-test-1) allows
# unsigned app bundles and checks the cosign signature instead. Its updater must check exactly this identity:
#   certificate identity  https://github.com/trina-app/trina-ax/.github/workflows/dev-build.yml@refs/heads/dev
#   OIDC issuer           https://token.actions.githubusercontent.com
#
# The artifact holds three files:
#   <version>-linux-amd64.tar.zst               the version folder, packed (for `mycel-ctl update --bundle`)
#   <version>-linux-amd64.tar.zst.sigstore.json the cosign bundle (certificate + signature + Rekor entry)
#   manifest.json                               {commit, version, builtAt, sha256, bundle}
# The OCI manifest also has the annotations dev.trina.commit and dev.trina.version, so a server can read the commit
# with `oras manifest fetch` and download nothing else.
#
# This is not a required check and does not run for pull requests. A failed run does not stop merges into dev.
name: Dev build

on:
  push:
    branches: [dev]
  workflow_dispatch:

# only the newest dev commit matters: a new push cancels the build of the previous one
concurrency:
  group: dev-build
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.3.12
  # the same Go as release.yml (versions.json "go"), so the root programs' bytes match a release build
  GO_VERSION: 1.27.3
  GOTOOLCHAIN: local
  ARCH: amd64
  # pinned tools for the publish job (the dev test server uses the same versions)
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  ORAS_VERSION: 1.3.4
  ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
  IMAGE: ghcr.io/trina-app/trina-ax-dev

jobs:
  build:
    name: Linux bundle (amd64, dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # no OIDC token and no package write here: package install scripts run in this job
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # <package version>.dev.<UTC time> (or <package version>-dev.<UTC time> for a plain release version):
      # newer than the package version's release, older than the next pre-release, and in time order between dev builds
      # (compareVersions in server/src/system/update.ts and native/cmd/mycel-ctl/update.go)
      - name: Dev version
        id: version
        run: |
          pkg=$(bun -e 'console.log(require("./server/package.json").version)')
          ts=$(date -u +%Y%m%d%H%M%S)
          case "$pkg" in *-*) v="$pkg.dev.$ts" ;; *) v="$pkg-dev.$ts" ;; esac
          if ! [[ "$v" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,49}$ ]]; then echo "::error::not a valid version folder name: $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "dev build $v from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: whisper-cli (static, this arch)
        run: bash scripts/linux/build-whisper.sh --arch "$ARCH" --out dist/whisper
      - run: bun install --frozen-lockfile
      - name: Native helpers (linux amd64)
        run: ARCHS="$ARCH" bash native/build.sh
      - run: bun run build:web
      - name: Linux bundle (--strict, unsigned) and verify-bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun scripts/build-bundle.ts --os linux --arch "$ARCH" --version "$VERSION" --whisper-dir dist/whisper --strict --out dist/linux
          dist/linux/app/"$VERSION"/root/mycel-ctl verify-bundle "dist/linux/app/$VERSION" --allow-unsigned
          mkdir -p out
          mv "dist/linux/$VERSION-linux-$ARCH.tar.zst" out/
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-bundle
          path: out/
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  publish:
    name: Sign (cosign keyless) and push to GHCR
    needs: build
    # only a build of the dev branch gets the identity the server trusts and moves :latest
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # no checkout and no package install in this job: it only signs and pushes the built file
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dev-bundle
          path: out
      - name: cosign and oras (pinned, sha256 checked)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  cosign" | sha256sum -c -
          install -m 755 cosign bin/cosign
          curl -fsSL -o oras.tar.gz "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  oras.tar.gz" | sha256sum -c -
          tar -xzf oras.tar.gz -C bin oras
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: manifest.json
        working-directory: out
        run: |
          f="$VERSION-linux-$ARCH.tar.zst"
          test -f "$f"
          sum=$(sha256sum "$f" | cut -d' ' -f1)
          jq -n --arg commit "$GITHUB_SHA" --arg version "$VERSION" --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sha256 "$sum" --arg bundle "$f" \
            '{commit: $commit, version: $version, builtAt: $builtAt, sha256: $sha256, bundle: $bundle}' > manifest.json
          cat manifest.json
      - name: Sign keyless and check the signature with the identity the server checks
        working-directory: out
        run: |
          f="$VERSION-linux-$ARCH.tar.zst"
          cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          cosign verify-blob --bundle "$f.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/dev-build.yml@refs/heads/dev" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
      - name: Push to GHCR (:<short sha>, then :latest)
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          f="$VERSION-linux-$ARCH.tar.zst"
          short="${GITHUB_SHA::12}"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          oras push "$IMAGE:$short" \
            --artifact-type application/vnd.trina.dev-bundle.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "dev.trina.commit=$GITHUB_SHA" \
            --annotation "dev.trina.version=$VERSION" \
            "manifest.json:application/json" \
            "$f:application/zstd" \
            "$f.sigstore.json:application/vnd.dev.sigstore.bundle.v0.3+json"
          # :latest moves only after the full push of this commit
          oras tag "$IMAGE:$short" latest
          oras logout ghcr.io
          {
            echo "pushed $IMAGE:$short and $IMAGE:latest"
            echo "version $VERSION, commit $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
