# Release (docs/RELEASE-CI.md): pushing a version tag builds, tests, signs and publishes everything. People only tag.
#
#   v0.3.0 (stable) / v0.3.0-beta.1 (beta), = server/package.json's version
#     prepare     the tag is the version; the release key is one this product's builds trust (RELEASE_CHANNEL.keys)
#     test        ci.yml on the tagged commit (every job of a normal push)        } in parallel
#     build-*     Linux kits amd64 + arm64, the office zip (macOS, universal),     } no secrets
#                 the Windows installer + latest.yml
#     build-mac-app   the Mac app (mac-app.yml): dmg + update zip + latest-mac.yml, Developer ID signed and notarized
#                 (with build-mac-whisper the only build jobs with secrets: the certificate and the App Store Connect API key)
#     build-linux-desktop   the Linux desktop app: .deb + AppImage for x64 and arm64, latest-linux.yml and
#                 latest-linux-arm64.yml (unsigned; no secrets)
#     build-mac-whisper   whisper-cli for the office zip's Apple silicon Macs (mac-whisper.yml): Metal, Developer ID
#                 signed and notarized; build-office waits for it and puts it in the zip
#     publish     sign the Linux builds, office feed (publish.ts), server feed (publish-server.ts), SHA256SUMS + .sig
#     github-release  the tag's GitHub Release with the kits, the office zip, the Windows installer, the Mac dmg, the
#                 Linux .deb and AppImage files and SHA256SUMS(.sig)
#     build-ami   stable only: starts team-image.yml on the tag (the new-team server AMI); a notice when AWS is not set up
#
# The Windows installer ships only when the Windows app changed, at most about once a week (owner, 2026-11-26: its
# signing plan counts every signing, and most releases change only the web, which the app loads from the team server;
# docs/RELEASE-CI.md 11장): prepare decides (scripts/release/windows-cadence.ts, from the GitHub Releases and the last
# Windows release's checkout; a tag message line "Windows: yes" or "Windows: no" decides instead). On the other days
# build-windows does not run, the office feed names the last Windows build again (publish.ts --keep-windows) and the
# GitHub Release says so in one line. Everything else ships.
#
# The Linux server release does not wait for the desktop builds: when build-office or build-windows fails or gets no
# runner, publish still runs (prepare, test and build-linux must pass), the office feed stays at the previous release,
# and the GitHub Release says which downloads are missing. "Re-run failed jobs" later adds them (docs/RELEASE-CI.md 6).
# The Mac app rides along: without it (build-mac-app failed) the office feed goes out without `mac`, and a re-run that
# passes adds it to the same version's manifest (publish.ts versionManifestAction). The Linux desktop app rides along
# the same way (build-linux-desktop): never a reason to hold back the release.
#
# Secrets (repository secrets, set by the owner: docs/RELEASE-CI.md): RELEASE_SIGNING_KEY (the Ed25519 PEM) and
# CLOUDFLARE_API_TOKEN. Only `prepare` (checks the key) and `publish` see them, only in the steps that use them; the
# key lives in a 600 file under $RUNNER_TEMP that is removed whatever happens. The Mac app's signing secrets
# (MAC_DEVELOPER_ID_P12_BASE64, MAC_DEVELOPER_ID_P12_PASSWORD, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8)
# go only to build-mac-app (mac-app.yml), the same way. Nothing here runs for pull requests.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to run again (e.g. v0.3.0). Choose the same tag under 'Use workflow from'."
        required: true
        type: string
      rollout:
        description: "Stable releases: tag = as the tag message says (a 'Rollout: all' line, else staged over three days); staged; all = every server at once. Only a release not on the feed yet takes it."
        required: false
        default: tag
        type: choice
        options: [tag, staged, all]
      windows:
        description: "The Windows installer: tag = as the tag message says (a 'Windows: yes' or 'Windows: no' line, else when the Windows app changed, at most once a week, docs/RELEASE-CI.md 11장); yes = build it now; no = not in this release. A run again of a published tag always does what its first run did."
        required: false
        default: tag
        type: choice
        options: [tag, yes, no]
      office_only:
        description: "Only the desktop downloads (office zip + Windows installer) of a release whose Linux server release is already out: no tests, no Linux build, the server feed is not touched. For a tag whose build-office got no runner and whose run can no longer be re-run (docs/RELEASE-CI.md 6)."
        required: false
        default: false
        type: boolean
      mac_runner:
        description: "The macOS runner for the office zip and the Mac app; empty = the repository variable RELEASE_MAC_RUNNER, else macos-15. macos-15-intel draws from another hosted pool when the arm64 Macs have no capacity; trina-mac-release is the self-hosted release Mac (docs/RELEASE-CI.md 13)."
        required: false
        default: ""
        type: string

# one release at a time (the feed's "never back" check reads what the previous one published)
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

# bash -eo pipefail everywhere (also on Windows: Git Bash)
defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.3.12
  # Go that builds the native programs, exactly (versions.json "go"; docs/RELEASE-CI.md "Go 버전"): a newer patch
  # changes the root programs' bytes, and every Linux release would then need the root update (needsRoot)
  GO_VERSION: 1.27.3
  GOTOOLCHAIN: local

jobs:
  prepare:
    name: Tag, version and release key
    runs-on: ubuntu-24.04
    # environment release: deployment only from v* tags (and main for feed.yml), no required reviewers: the tag push is
    # the approval (owner, 2026-11-14; v* tags are limited by a tag ruleset, docs/RELEASE-CI.md 10장)
    environment: release
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      sha: ${{ steps.release.outputs.sha }}
      feed: ${{ steps.key.outputs.feed }}
      rollout: ${{ steps.notes.outputs.rollout }}
      windows: ${{ steps.windows.outputs.windows }}
      windows_last: ${{ steps.windows.outputs.windows_last }}
    steps:
      - name: Which tag
        id: which
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then tag="$INPUT_TAG"; else tag="$REF_NAME"; fi
          # a manual run uses the workflow file of "Use workflow from": it must be the tag itself, not a branch
          if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "::error::choose the tag $tag under 'Use workflow from' (this run is from $GITHUB_REF)"
            exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,6}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+){0,3})?$ ]]; then
            echo "::error::not a release tag (v0.3.0 or v0.3.0-beta.1 form)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.which.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: The tag is server/package.json's version
        id: release
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          bun scripts/release/release-ci.ts tag "$TAG" | tee -a "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
      # only a reviewed commit ships: main takes changes through a reviewed PR (ruleset "main protection"), so the tagged
      # commit must be on main. GitHub's compare says "identical" or "behind" when main already contains it (the same
      # answer as `git merge-base --is-ancestor`, without fetching main's history into this shallow checkout).
      - name: The tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          # the branch's commit, not a ref named main (a tag "main" would win in compare)
          main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$main...$SHA" --jq .status)
          case "$status" in
            identical|behind) echo "$SHA is on main ($status)" ;;
            *) echo "::error::$SHA is not on main (compare: $status). Merge the release to main through a reviewed PR, then tag main's commit."; exit 1 ;;
          esac
      # the staged roll-out (docs/RELEASE-CI.md "단계적 배포"): a "Rollout: all" line in the tag message (taken out of the
      # notes) or the manual run's input publishes a stable release to every server at once; otherwise it is staged
      - name: Release notes (the annotated tag's message; empty for a lightweight tag) and the roll-out
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
          INPUT_ROLLOUT: ${{ inputs.rollout }}
        run: |
          mkdir -p notes
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message > notes/tag-message.md
          else
            : > notes/tag-message.md
          fi
          bun scripts/release/release-ci.ts rollout notes/tag-message.md "$INPUT_ROLLOUT" --notes-out notes/notes.md | tee -a "$GITHUB_OUTPUT"
          wc -c notes/notes.md
      # the Windows installer when the Windows app changed, at most about once a week (scripts/release/windows-cadence.ts
      # has the rule): from the GitHub Releases (which had the installer, when, signed or not), the Windows app of this
      # tag against the last Windows release's (scripts/release/windows-inputs.ts) and a "Windows: yes|no" line, taken
      # out of the notes
      - name: The last release with the Windows installer
        id: windows_prev
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          # 3 tries; still no answer: windows-cadence.ts leaves Windows out with a warning, the rest of the release goes on
          for i in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json" && break
            rm -f "$RUNNER_TEMP/releases.json"; sleep 10
          done
          bun scripts/release/windows-cadence.ts last --tag "$TAG" --releases "$RUNNER_TEMP/releases.json" | tee -a "$GITHUB_OUTPUT"
      # that tag next to this one, to compare the Windows app with (no checkout: the 7 days alone decide)
      - name: Check out the last Windows release
        if: steps.windows_prev.outputs.tag != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.windows_prev.outputs.tag }}
          path: .windows-last
          persist-credentials: false
      - name: Does this release ship the Windows installer
        id: windows
        env:
          TAG: ${{ steps.which.outputs.tag }}
          LAST: ${{ steps.windows_prev.outputs.tag }}
          INPUT_WINDOWS: ${{ inputs.windows }}
          SIGNING: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
          LIMIT: ${{ vars.WINDOWS_SIGNING_MONTHLY_LIMIT }}
        run: |
          # the packages both Windows apps are built from (no install scripts: only the JavaScript is bundled); a failed
          # install leaves that tree out and windows-cadence.ts cannot compare (a warning, the 7 days decide)
          # (3 minutes each at most: a hanging install never holds up the release)
          timeout 180 bun install --frozen-lockfile --ignore-scripts || echo "::warning::bun install failed for $TAG"
          tree=()
          if [ -n "$LAST" ] && [ -d .windows-last/desktop ]; then
            if (cd .windows-last && timeout 180 bun install --frozen-lockfile --ignore-scripts); then tree=(--last-tree .windows-last --last-tree-tag "$LAST")
            else echo "::warning::bun install failed for $LAST"; fi
          fi
          bun scripts/release/windows-cadence.ts decide --tag "$TAG" --notes notes/notes.md --releases "$RUNNER_TEMP/releases.json" --input "$INPUT_WINDOWS" --signing "$SIGNING" --limit "$LIMIT" "${tree[@]}" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/notes.md
          if-no-files-found: error
          overwrite: true # a re-run of the job replaces its own artifact
          retention-days: 30
      # fail now, not after an hour of builds: the release key is there and is this product's. Without
      # CLOUDFLARE_API_TOKEN the release goes to GitHub Releases only (no update feed): feed=false.
      - name: The release key is one this product's builds trust
        id: key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::error::secret RELEASE_SIGNING_KEY is not set (docs/RELEASE-CI.md)"; exit 1; fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "feed=true" >> "$GITHUB_OUTPUT"; else
            echo "feed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set: GitHub Release only, the update feed is not changed"
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          bun scripts/release/release-ci.ts check-key "$RUNNER_TEMP/release-key.pem"
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"

  test:
    name: Tests
    needs: prepare
    # office_only: the tagged commit was tested by the release's first run
    if: ${{ !inputs.office_only }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build-linux:
    name: Linux kit (${{ matrix.arch }})
    needs: prepare
    if: ${{ !inputs.office_only }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: whisper-cli (static, this arch)
        run: bash scripts/linux/build-whisper.sh --arch "$ARCH" --out dist/whisper
      - run: bun install --frozen-lockfile
      - name: Native helpers (linux ${{ matrix.arch }})
        run: ARCHS="$ARCH" bash native/build.sh
      - run: bun run build:web
      - name: Linux bundle and kit (--strict, unsigned; publish signs it)
        run: |
          notes=()
          if [ -s notes/notes.md ]; then notes=(--notes notes/notes.md); fi
          bun scripts/build-bundle.ts --os linux --arch "$ARCH" --version "$VERSION" --whisper-dir dist/whisper --strict "${notes[@]}" --out dist/linux
          # tar keeps the file modes (an artifact does not); the unsigned packs are not needed
          tar -C dist/linux -cf "dist/release-linux-$ARCH.tar" app install-linux.sh VERSION product.env
          # plugins ship separately: no rhwp, runtime font, resources/hwp or .trinaplugin in a default kit (docs/PLUGINS.md)
          bun scripts/plugins/release-check.ts "dist/release-linux-$ARCH.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release-linux-${{ matrix.arch }}.tar
          if-no-files-found: error
          overwrite: true # a re-run of the job replaces its own artifact
          retention-days: 7

  build-mac-whisper:
    name: Mac whisper-cli
    needs: prepare
    uses: ./.github/workflows/mac-whisper.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      runner: ${{ inputs.mac_runner }}
      retention-days: 7
    secrets:
      MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
      MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

  build-office:
    name: Office zip (macOS, universal)
    # the zip carries the signed Apple silicon whisper-cli (voice input and recordings with no key)
    needs: [prepare, build-mac-whisper]
    # macos-14 images were retired ("macos-14-arm64-us-default is not supported", v0.4.0-beta.9 on 2026-11-06); macos-15
    # (arm64) had no runner on 2026-11-02, 03, 12 and 13 (v0.5.2, v0.5.3). The zip is universal either way: Go and swiftc
    # cross-build both Mac processors (native/build.sh), so an Intel runner builds the same zip.
    runs-on: ${{ inputs.mac_runner || vars.RELEASE_MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # the self-hosted release Mac (docs/RELEASE-CI.md 13) takes only release.yml at a v* tag of this repository (tag
      # push or Run workflow with the tag); its job-started hook checks the same on the host before any step
      - name: Release Mac runner guard
        if: runner.environment == 'self-hosted'
        env:
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          refuse() { echo "::error::the self-hosted release Mac runs only release.yml at a v* tag of trina-app/trina-ax: $*"; exit 1; }
          [ "$REPO" = trina-app/trina-ax ] || refuse "repository $REPO"
          [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ] || refuse "event $EVENT"
          [[ "$REF" == refs/tags/v* ]] || refuse "ref $REF"
          [[ "$WORKFLOW_REF" == "trina-app/trina-ax/.github/workflows/release.yml@refs/tags/v"* ]] || refuse "workflow $WORKFLOW_REF"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-whisper
          path: dist
      - name: Office zip (native helpers for both Mac processors, mycel-ocr with swiftc, web, bundle)
        run: |
          swiftc --version | head -1
          tar -C dist -xf dist/mac-whisper.tar
          bun run build:office -- --version "$VERSION" --whisper dist/mac-whisper/whisper-cli
          ls -l dist/office/*-mac.zip
          bun scripts/plugins/release-check.ts dist/office/*-mac.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-office
          path: dist/office/*-mac.zip
          if-no-files-found: error
          overwrite: true # a re-run of the job replaces its own artifact
          retention-days: 7

  build-mac-app:
    name: Mac app
    needs: prepare
    uses: ./.github/workflows/mac-app.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      runner: ${{ inputs.mac_runner }}
      retention-days: 7
    secrets:
      MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
      MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

  build-windows:
    name: Windows installer
    needs: prepare
    # when the Windows app changed, at most about once a week (prepare "Does this release ship the Windows installer"):
    # skipped on the other days
    if: ${{ needs.prepare.outputs.windows == 'true' }}
    runs-on: windows-2025
    # environment release: the SSL.com eSigner credentials are secrets of this environment (docs/RELEASE-CI.md 11장).
    # Its deployment rules (v* tags, main) apply to this job too, signed or not: a release run is always from a tag
    # (prepare checks it). Of the secrets it reads only the four SSLCOM_*, never the release key or the Cloudflare token.
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Code signing (docs/RELEASE-CI.md 11장): the repository variable WINDOWS_SIGNING_PROVIDER switches it on
      # (`sslcom`). Empty = the unsigned installer, as before (desktop/scripts/win-sign.ts).
      MYCEL_WIN_SIGN_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
      CODESIGNTOOL_VERSION: v1.3.2
      CODESIGNTOOL_SHA256: f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Java for CodeSignTool (pinned)
        if: env.MYCEL_WIN_SIGN_PROVIDER != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: SSL.com CodeSignTool (pinned, sha256 checked)
        if: env.MYCEL_WIN_SIGN_PROVIDER != ''
        shell: pwsh
        # the plain zip (the jar and the production conf/); the -windows zip only adds a 200 MB JDK 11
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'codesigntool.zip'
          Invoke-WebRequest -Uri "https://github.com/SSLcom/CodeSignTool/releases/download/$env:CODESIGNTOOL_VERSION/CodeSignTool-$env:CODESIGNTOOL_VERSION.zip" -OutFile $zip
          $sum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($sum -ne $env:CODESIGNTOOL_SHA256) { throw "CodeSignTool zip sha256 $sum, expected $env:CODESIGNTOOL_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'codesigntool'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          "MYCEL_WIN_SIGN_TOOL=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: NSIS installer and latest.yml (signed when WINDOWS_SIGNING_PROVIDER is set, else unsigned)
        # the credentials reach this step only when signing is switched on; an unsigned build gets empty values
        env:
          MYCEL_SSLCOM_USERNAME: ${{ vars.WINDOWS_SIGNING_PROVIDER != '' && secrets.SSLCOM_USERNAME || '' }}
          MYCEL_SSLCOM_PASSWORD: ${{ vars.WINDOWS_SIGNING_PROVIDER != '' && secrets.SSLCOM_PASSWORD || '' }}
          MYCEL_SSLCOM_CREDENTIAL_ID: ${{ vars.WINDOWS_SIGNING_PROVIDER != '' && secrets.SSLCOM_CREDENTIAL_ID || '' }}
          MYCEL_SSLCOM_TOTP_SECRET: ${{ vars.WINDOWS_SIGNING_PROVIDER != '' && secrets.SSLCOM_TOTP_SECRET || '' }}
        run: |
          bun run --cwd desktop dist:win -- "-c.extraMetadata.version=$VERSION"
          ls -l desktop/release
          bun scripts/plugins/release-check.ts desktop/dist
          tr -d '\r' < desktop/release/latest.yml | grep -qx "version: $VERSION"
      - name: The installer and the app carry a valid signature
        if: env.MYCEL_WIN_SIGN_PROVIDER != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $files = @(Get-ChildItem desktop/release/*-Setup-*-win-x64.exe) + @(Get-ChildItem desktop/release/win-unpacked/*.exe)
          if ($files.Count -lt 2) { throw "expected the installer and the app exe, found $($files.Count) files" }
          foreach ($f in $files) {
            & $signtool.FullName verify /pa /tw $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa failed for $($f.Name)" }
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Host "$($f.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            desktop/release/*-Setup-*-win-x64.exe
            desktop/release/latest.yml
          if-no-files-found: error
          overwrite: true # a re-run of the job replaces its own artifact
          retention-days: 7

  # the Linux desktop app (docs/decisions/20261119-linux-desktop-app.md): both processors on the x64 runner (no native
  # modules on Linux). A desktop download like the Windows installer, so office_only builds it too.
  build-linux-desktop:
    name: Linux desktop app
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: .deb and AppImage (x64, arm64), latest-linux.yml and latest-linux-arm64.yml
        run: |
          bun run --cwd desktop dist:linux -- "-c.extraMetadata.version=$VERSION"
          ls -l desktop/release
          # desktop/dist: the app's code; desktop/release: the packages and the unpacked apps electron-builder made
          bun scripts/plugins/release-check.ts desktop/dist desktop/release
          for y in latest-linux.yml latest-linux-arm64.yml; do
            grep -qx "version: $VERSION" "desktop/release/$y" || { echo "::error::$y does not name $VERSION"; exit 1; }
          done
          for s in linux-amd64.deb linux-arm64.deb linux-x86_64.AppImage linux-arm64.AppImage; do
            compgen -G "desktop/release/*-$VERSION-$s" > /dev/null || { echo "::error::no *-$VERSION-$s in desktop/release"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-desktop
          path: |
            desktop/release/*-linux-amd64.deb
            desktop/release/*-linux-arm64.deb
            desktop/release/*-linux-x86_64.AppImage
            desktop/release/*-linux-arm64.AppImage
            desktop/release/latest-linux.yml
            desktop/release/latest-linux-arm64.yml
          if-no-files-found: error
          overwrite: true # a re-run of the job replaces its own artifact
          retention-days: 7

  publish:
    name: Sign and publish to the update feed
    needs: [prepare, test, build-linux, build-office, build-windows, build-mac-app, build-linux-desktop]
    # the server release goes out without the office zip or the Windows installer (macOS runners got none on
    # 2026-11-02..04); !cancelled(): a person who cancels the run still stops it
    # office_only: no tests and no Linux build in this run (skipped); the server feed is left alone below
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (inputs.office_only || (needs.test.result == 'success' && needs.build-linux.result == 'success')) }}
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      SHA: ${{ needs.prepare.outputs.sha }}
      ROLLOUT: ${{ needs.prepare.outputs.rollout }}
      OFFICE_OK: ${{ needs.build-office.result == 'success' }}
      WINDOWS_OK: ${{ needs.build-windows.result == 'success' }}
      # false: this release has no Windows build by design (the office feed keeps the last one: --keep-windows)
      WINDOWS_PLANNED: ${{ needs.prepare.outputs.windows }}
      MAC_OK: ${{ needs.build-mac-app.result == 'success' }}
      LINUX_DESKTOP_OK: ${{ needs.build-linux-desktop.result == 'success' }}
    outputs:
      office: ${{ steps.desktop.outputs.office }}
      windows: ${{ steps.desktop.outputs.windows }}
      mac: ${{ steps.desktop.outputs.mac }}
      linux_desktop: ${{ steps.desktop.outputs.linux_desktop }}
    steps:
      - name: The tag still names the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          got=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$got" != "$SHA" ]; then echo "::error::$TAG now names $got, not the tested $SHA: tag a new version"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # the release scripts need the packages (zod, …); no package's install script runs in the job that holds the key
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: in
      - name: Unpack the Linux builds
        if: ${{ !inputs.office_only }}
        run: |
          for a in amd64 arm64; do
            mkdir -p "build/linux-$a"
            tar -xpf "in/release-linux-$a/release-linux-$a.tar" -C "build/linux-$a"
          done
      # only the files of a build that passed this run (an older attempt's artifact can still be there)
      - name: Which desktop builds are here
        id: desktop
        run: |
          echo "office=$OFFICE_OK" >> "$GITHUB_OUTPUT"
          echo "windows=$WINDOWS_OK" >> "$GITHUB_OUTPUT"
          echo "mac=$MAC_OK" >> "$GITHUB_OUTPUT"
          # the Linux build must also pass publish.ts's own checks (each yml against its AppImage, the version): if not,
          # it is left out of this release here, so the office feed step below never fails on it
          if [ "$LINUX_DESKTOP_OK" = true ] && ! bun scripts/release/publish.ts --check-linux in/release-linux-desktop --version "$VERSION"; then
            echo "::warning::the Linux desktop build did not pass publish.ts --check-linux: no Linux desktop app in this release"
            LINUX_DESKTOP_OK=false
          fi
          echo "linux_desktop=$LINUX_DESKTOP_OK" >> "$GITHUB_OUTPUT"
          if [ "$OFFICE_OK" = true ]; then ls -l in/release-office; else echo "::warning::build-office did not pass: no office zip in this release"; fi
          if [ "$WINDOWS_OK" = true ]; then ls -l in/release-windows
          elif [ "$WINDOWS_PLANNED" != true ]; then echo "No Windows build in this release (the Windows app did not change, or not yet a week): the office feed keeps the last one"
          else echo "::warning::build-windows did not pass: no Windows installer in this release"; fi
          if [ "$MAC_OK" = true ]; then ls -l in/release-mac; else echo "::warning::build-mac-app did not pass: no Mac app in this release"; fi
          if [ "$LINUX_DESKTOP_OK" = true ]; then ls -l in/release-linux-desktop; else echo "::warning::build-linux-desktop did not pass: no Linux desktop app in this release"; fi
      # office_only: the Linux files the release already has (its GitHub Release), checked against the release's signed
      # SHA256SUMS and then listed again in the new one; they are not signed or published again. Before anything is
      # published: a tag whose server release never went out (no GitHub Release, no kits) stops here.
      - name: The published Linux files (office_only)
        if: ${{ inputs.office_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$OFFICE_OK" != true ] || { [ "$WINDOWS_PLANNED" = true ] && [ "$WINDOWS_OK" != true ]; }; then echo "::error::office_only needs both desktop builds (build-office $OFFICE_OK, build-windows $WINDOWS_OK)"; exit 1; fi
          mkdir -p published build/server
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sig' --dir published
          bun scripts/release/release-ci.ts verify-sums published/SHA256SUMS
          for a in amd64 arm64; do ls published/*-linux-"$a".tar.gz > /dev/null || { echo "::error::$TAG has no linux-$a kit on its GitHub Release"; exit 1; }; done
          for f in published/*.tar.gz; do
            grep -q "  $(basename "$f")\$" published/SHA256SUMS || { echo "::error::$(basename "$f") is not in the release's SHA256SUMS"; exit 1; }
            mv "$f" build/server/
          done
          ls -l build/server
      - name: Release key (from the secret, never printed)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          echo "TEAMAX_RELEASE_KEY=$RUNNER_TEMP/release-key.pem" >> "$GITHUB_ENV"
          bun scripts/release/release-ci.ts check-key "$RUNNER_TEMP/release-key.pem"
      - name: Sign the Linux builds (manifest.sig; update archive and install kit)
        if: ${{ !inputs.office_only }}
        run: |
          mkdir -p build/server
          for a in amd64 arm64; do
            bun scripts/release/release-ci.ts sign-linux "build/linux-$a" "$a" "$TEAMAX_RELEASE_KEY"
            mv "build/linux-$a/"*.tar.zst "build/linux-$a/"*.tar.gz build/server/
          done
          ls -l build/server
      # without a Windows build this release (windows-cadence.ts), --keep-windows names the channel head's Windows app again
      - name: Office feed (zip + Windows installer)
        if: needs.prepare.outputs.feed == 'true' && needs.build-office.result == 'success' && (needs.build-windows.result == 'success' || needs.prepare.outputs.windows != 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          zip=$(ls in/release-office/*-mac.zip)
          if [ "$WINDOWS_PLANNED" = true ]; then win=(--windows "$(ls in/release-windows/*-Setup-*-win-x64.exe)"); else win=(--keep-windows); fi
          mac=()
          if [ "$MAC_OK" = true ]; then mac=(--mac "$(ls in/release-mac/*-mac-universal.dmg)"); fi
          linux=()
          if [ "${{ steps.desktop.outputs.linux_desktop }}" = true ]; then linux=(--linux in/release-linux-desktop); fi
          bun scripts/release/publish.ts --channel "$CHANNEL" --version "$VERSION" --office "$zip" "${win[@]}" "${mac[@]}" "${linux[@]}" --notes-file in/release-notes/notes.md --rollout "$ROLLOUT"
          # a stable release is also the beta channel's newest, unless beta is already ahead (the beta channel has no ramp)
          if [ "$CHANNEL" = stable ]; then
            bun scripts/release/publish.ts --channel beta --if-newer --version "$VERSION" --office "$zip" "${win[@]}" "${mac[@]}" "${linux[@]}" --notes-file in/release-notes/notes.md --rollout "$ROLLOUT"
          fi
      - name: Office feed not changed
        if: needs.prepare.outputs.feed == 'true' && !(needs.build-office.result == 'success' && (needs.build-windows.result == 'success' || needs.prepare.outputs.windows != 'true'))
        run: echo "::warning::office and Windows were not published to the update feed (build-office $OFFICE_OK, build-windows $WINDOWS_OK); the office feed keeps the previous release"
      - name: Server feed (Linux)
        if: needs.prepare.outputs.feed == 'true' && !inputs.office_only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun scripts/release/publish-server.ts --channel "$CHANNEL" --version "$VERSION" --dir build/server --notes-file in/release-notes/notes.md --rollout "$ROLLOUT"
          # the same release.json (its roll-out too: servers on the beta channel skip the ramp themselves)
          if [ "$CHANNEL" = stable ]; then
            bun scripts/release/publish-server.ts --channel beta --if-newer --version "$VERSION" --dir build/server --notes-file in/release-notes/notes.md --rollout "$ROLLOUT"
          fi
      - name: SHA256SUMS and its signature
        run: |
          mkdir -p assets
          cp build/server/*.tar.gz assets/
          if [ "$OFFICE_OK" = true ]; then cp in/release-office/*-mac.zip assets/; fi
          if [ "$WINDOWS_OK" = true ]; then cp in/release-windows/*-Setup-*-win-x64.exe assets/; fi
          if [ "$MAC_OK" = true ]; then cp in/release-mac/*-mac-universal.dmg assets/; fi
          if [ "${{ steps.desktop.outputs.linux_desktop }}" = true ]; then cp in/release-linux-desktop/*.deb in/release-linux-desktop/*.AppImage assets/; fi
          bun scripts/release/release-ci.ts sums assets "$TEAMAX_RELEASE_KEY" assets/*
          bun scripts/release/release-ci.ts verify-sums assets/SHA256SUMS
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
          overwrite: true # a re-run of the job replaces its own artifact
          retention-days: 30

  # the new-team server image (AMI) of a stable release, in its own workflow (team-image.yml: hours long, and this run's
  # concurrency group would hold back feed.yml's hold meanwhile). Never fails the release: without AWS_ROLE_ARN it only
  # says so, and the image's own run fails on its own.
  build-ami:
    name: New-team server image (starts team-image.yml)
    # github-release too: the image run downloads the signed kit from the GitHub Release
    needs: [prepare, publish, github-release]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.github-release.result == 'success' && needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.feed == 'true' && !inputs.office_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the image build on the tag
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then echo "::notice::no new-team server image for $TAG: the repository variable AWS_ROLE_ARN is not set (docs/RELEASE-CI.md)"; exit 0; fi
          gh workflow run team-image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
          echo "::notice::team-image.yml started for $TAG (Actions → Team image)"

  github-release:
    name: GitHub Release
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      OFFICE_OK: ${{ needs.publish.outputs.office }}
      WINDOWS_OK: ${{ needs.publish.outputs.windows }}
      WINDOWS_PLANNED: ${{ needs.prepare.outputs.windows }}
      WINDOWS_LAST: ${{ needs.prepare.outputs.windows_last }}
      MAC_OK: ${{ needs.publish.outputs.mac }}
      LINUX_DESKTOP_OK: ${{ needs.publish.outputs.linux_desktop }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Create the release (or add the files to it on a re-run)
        run: |
          got=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$got" != "$SHA" ]; then echo "::error::$TAG now names $got, not the published $SHA"; exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            # every download is there now: the first run's "not in this release yet" line goes
            if [ "$OFFICE_OK" = true ] && { [ "$WINDOWS_OK" = true ] || [ "$WINDOWS_PLANNED" != true ]; } && [ "$MAC_OK" = true ] && [ "$LINUX_DESKTOP_OK" = true ]; then
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes/old.md
              if head -1 notes/old.md | grep -q '^\*\*Downloads not in this release yet:\*\*'; then
                tail -n +3 notes/old.md > notes/new.md
                gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes/new.md
              fi
            fi
            exit 0
          fi
          missing=()
          if [ "$OFFICE_OK" != true ]; then missing+=("Mac (office zip)"); fi
          if [ "$WINDOWS_OK" != true ] && [ "$WINDOWS_PLANNED" = true ]; then missing+=("Windows (installer)"); fi
          if [ "$MAC_OK" != true ]; then missing+=("Mac (app)"); fi
          if [ "$LINUX_DESKTOP_OK" != true ]; then missing+=("Linux (desktop app)"); fi
          flags=(--verify-tag --title "$TAG")
          # no notes in the tag message: GitHub's generated notes (after the lines below)
          generate=false
          if [ ! -s notes/notes.md ]; then generate=true; fi
          # a release without a Windows build by design (windows-cadence.ts) says which release's installer Windows keeps; a run again
          # of the tag reads this line (scripts/release/windows-cadence.ts SKIP_LINE_START) and skips Windows again
          if [ "$WINDOWS_PLANNED" != true ]; then
            winline="**Windows:** no new Windows installer in this release (a new one comes when the Windows app changes, at most about once a week)${WINDOWS_LAST:+; the current Windows installer is the one of $WINDOWS_LAST}."
            { echo "$winline"; echo; cat notes/notes.md; } > notes/windows.md
            mv notes/windows.md notes/notes.md
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            line="**Downloads not in this release yet:** $(IFS=,; echo "${missing[*]}" | sed 's/,/, /g'). Their build did not finish; the Linux server release is complete."
            { echo "$line"; echo; cat notes/notes.md; } > notes/body.md
            flags+=(--notes-file notes/body.md)
          elif [ -s notes/notes.md ]; then flags+=(--notes-file notes/notes.md); fi
          if [ "$generate" = true ]; then flags+=(--generate-notes); fi
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
