# Docker image test (docs/INSTALL-DOCKER.md): build the image from a published release kit, start it with
# docker/docker-compose.yml and run docker/test.sh (health, setup, engine firewall, bubblewrap + Landlock + seccomp).
# Manual only for now: it downloads the kit (about 190 MB) and the pinned Claude Code (about 300 MB) on each run.
# The runners are Ubuntu 24.04 hosts: the job sets kernel.apparmor_restrict_unprivileged_userns=0, as
# docs/INSTALL-DOCKER.md "Ubuntu 24.04 hosts" tells a host owner. Without it the container is never healthy.
# Same GitHub-hosted runners as ci.yml; no secret is used.
name: Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: release to test (a tag without the v, 0.5.0-beta.1 or later)
        type: string
        required: true

permissions:
  contents: read

jobs:
  docker-image:
    name: Docker image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Host settings the container cannot make
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=1
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build, start and check (docker/test.sh)
        env:
          TRINA_AX_VERSION: ${{ inputs.version }}
        run: bash docker/test.sh
