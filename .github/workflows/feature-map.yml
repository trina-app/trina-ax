# The feature map (docs/FEATURES.md): on every push to dev, runs the web e2e suite against the mock team server, keeps
# the endpoints it reached (web/test-results/feature-coverage.json) as an artifact, and rewrites the "Features" tab of
# the QA sheet when its secrets are set. Not a required check, and not on pull requests (the suite takes long: it runs in
# four shards).
# A burst of merges does not cancel a run that is going: one runs, the newest push waits (GitHub keeps one pending).
# A failing e2e test fails its shard and the run ends red, but only after the coverage of every shard is uploaded and the
# Features tab is rewritten (the sheet job still runs). Each shard's failed tests are listed in the run summary.
#
# One-time setup (docs/FEATURES.md "Sheet sync in CI"): the secret GOOGLE_SHEETS_SA_JSON (a Google service account's key
# JSON, the sheet shared with its e-mail as an editor) and the secret FEATURES_SHEET_ID (the QA sheet's
# id). Without them the sheet step is skipped. The script writes only the Features tab, the QA tab's Feature ID header
# cell and that column's dropdown.
name: Feature map

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: feature-map
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.12

jobs:
  e2e:
    # four shards at once, each with its own mock team server (the suite runs one test at a time per server)
    name: e2e coverage (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      # the pinned rhwp CLI: the mock team server draws a Hangul file's pages with it (the HWP preview specs)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native/bin/hwp
          key: rhwp-${{ runner.os }}-${{ hashFiles('resources/hwp/manifest.json') }}
      - name: Pinned Hangul renderer
        run: bun run prepare:hwp
      - name: Web build
        run: bun run build:web
      # previews.spec.ts makes its test videos with ffmpeg (VP9/Opus, H.264/AAC); the runner image has none
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Playwright browsers (Chromium, WebKit)
        run: cd web && bunx playwright install --with-deps chromium webkit
      # no continue-on-error: a failed test fails the shard (and the run); the steps below run anyway (if: always())
      - name: e2e suite, shard ${{ matrix.shard }} of 4 (records the endpoints it reaches)
        run: cd web && bunx playwright test -c playwright.config.ts --shard=${{ matrix.shard }}/4 --reporter=dot,json
        env:
          FEATURE_COVERAGE_FILE: ${{ github.workspace }}/coverage/feature-coverage-${{ matrix.shard }}.json
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-report.json
      - name: Failed tests in the run summary
        if: ${{ !cancelled() }}
        run: bun scripts/features/e2e-failures.ts "$RUNNER_TEMP/e2e-report.json" "shard ${{ matrix.shard }}/4" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: feature-coverage-${{ matrix.shard }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  sheet:
    name: Features tab of the QA sheet
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the whole history: the tab's "Last contract change" is the date of a file's last commit
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run features:check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: feature-coverage-*
          path: coverage
          merge-multiple: true
      - name: Rewrite the Features tab
        env:
          GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
          FEATURES_SHEET_ID: ${{ secrets.FEATURES_SHEET_ID }}
        run: |
          ls coverage || true
          if [ -z "$GOOGLE_SHEETS_SA_JSON" ] || [ -z "$FEATURES_SHEET_ID" ]; then
            echo "::notice::GOOGLE_SHEETS_SA_JSON or FEATURES_SHEET_ID is not set: the Features tab is not updated (docs/FEATURES.md)"
            exit 0
          fi
          args=(); for f in coverage/feature-coverage-*.json; do [ -f "$f" ] && args+=(--coverage "$f"); done
          # a shard that did not finish would count its endpoints as never reached: keep the tab as it is
          if [ "${#args[@]}" -ne 8 ]; then
            echo "::warning::$(( ${#args[@]} / 2 )) of 4 coverage files: the Features tab is not updated"
            exit 0
          fi
          bun scripts/features/sync-sheet.ts "${args[@]}"
