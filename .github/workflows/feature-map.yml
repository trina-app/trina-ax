# The feature map (docs/FEATURES.md): on every push to dev, runs the web e2e suite against the mock team server, keeps
# the endpoints it reached (web/test-results/feature-coverage.json) as an artifact, and rewrites the "Features" tab of
# the QA sheet when its secrets are set. Not a required check, and not on pull requests (the suite takes about an hour).
# A burst of merges does not cancel a run that is going: one runs, the newest push waits (GitHub keeps one pending).
# Failing e2e tests do not fail this workflow (the coverage of the run is still written); the report artifact shows them.
#
# Secrets (one-time owner setup, docs/FEATURES.md "Sheet sync in CI"): GOOGLE_SHEETS_SA_JSON (a Google service
# account's key JSON, the sheet shared with its e-mail as an editor) and FEATURES_SHEET_ID (the QA sheet's id). Without
# them the sheet step is skipped.
name: Feature map

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: feature-map
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.12

jobs:
  coverage:
    name: e2e coverage and Features tab
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the whole history: the Features tab's "Last contract change" is the date of a file's last commit
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run features:check
      - name: Web build
        run: bun run build:web
      - name: Playwright browsers (Chromium, WebKit)
        run: cd web && bunx playwright install --with-deps chromium webkit
      - name: e2e suite (records the endpoints it reaches)
        continue-on-error: true
        run: cd web && bunx playwright test -c playwright.config.ts --reporter=dot,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: feature-coverage
          path: |
            web/test-results/feature-coverage.json
            web/playwright-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Features tab of the QA sheet
        env:
          GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
          FEATURES_SHEET_ID: ${{ secrets.FEATURES_SHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SHEETS_SA_JSON" ] || [ -z "$FEATURES_SHEET_ID" ]; then
            echo "::notice::GOOGLE_SHEETS_SA_JSON or FEATURES_SHEET_ID is not set: the Features tab is not updated (docs/FEATURES.md)"
            exit 0
          fi
          bun scripts/features/sync-sheet.ts
