# T3: the real-engine lockdown test on our own Proxmox LXC tenant (linux-runtime spec 3.9.3). It installs the
# commit's bundle into an LXC tenant (Debian 13, unprivileged, nesting=1, kernel with Landlock ABI >= 6), stops the
# server, and runs the Claude Code 2.1.305 and Codex 0.163.0 lockdown checks against the installed launcher, firewall
# and model proxy with the real models. It needs test-only Claude and ChatGPT logins held on the self-hosted runner,
# so it never runs on a fork PR. It is the required check before the engine pins in versions.json change.
name: linux-lockdown

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: linux-lockdown
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lockdown:
    name: Real-engine lockdown (Claude Code 2.1.305, Codex 0.163.0)
    # the engine-pin label gates the PR path; schedule and manual always run
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-pin')
    runs-on: [self-hosted, linux, pve-ci]
    timeout-minutes: 60
    env:
      MYCEL_LOCKDOWN_INSTALLED: /var/lib/mycel-ci
    steps:
      - uses: actions/checkout@v4
      # L25 (tests/lib/engines.ts installed mode + scripts/linux/lockdown-setup.sh + the pve-ci runner) is not built
      # yet: fail with that reason instead of a confusing missing-file error
      - name: The T3 harness exists (L25)
        run: test -f scripts/linux/lockdown-setup.sh || { echo "::error::T3 needs L25 (scripts/linux/lockdown-setup.sh, MYCEL_LOCKDOWN_INSTALLED mode in tests/lib/engines.ts)"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.12" }
      - uses: actions/setup-go@v5
        with: { go-version-file: native/go.mod, cache-dependency-path: native/go.sum }
      - run: bun install --frozen-lockfile
      - name: Build this commit's bundle (arch of the runner)
        run: |
          ARCH=$([ "$(uname -m)" = aarch64 ] && echo arm64 || echo amd64)
          bash scripts/linux/build-whisper.sh --arch "$ARCH" --out dist/whisper
          ARCHS=$ARCH bash native/build.sh
          V=$(bun -e 'console.log(require("./server/package.json").version)')-lockdown.${{ github.run_number }}
          bun scripts/build-bundle.ts --os linux --arch "$ARCH" --version "$V" --whisper-dir dist/whisper --out dist/kit
      - name: Install / update the tenant (--hosted) and put the test logins in place
        # the runner holds the test-only setup-token and auth.json as root 600 files and drops them into the tenant;
        # the tenant is permanent so Codex refresh-token rotation persists (spec 3.9.3)
        run: sudo bash scripts/linux/lockdown-setup.sh --kit dist/kit --id mycel-ci --base "$MYCEL_LOCKDOWN_INSTALLED"
      - name: Lockdown checks against the installed launcher / firewall / proxy
        # tests/lib/engines.ts MYCEL_LOCKDOWN_INSTALLED mode uses the tenant's launcher.sock, run dir, subscription
        # proxy and secrets; the nft engine_out reject counter must stay 0 during a turn (no unknown egress)
        run: sudo MYCEL_LOCKDOWN_INSTALLED="$MYCEL_LOCKDOWN_INSTALLED" bun run tests/engine/lockdown-claude.ts && sudo MYCEL_LOCKDOWN_INSTALLED="$MYCEL_LOCKDOWN_INSTALLED" bun run tests/engine/lockdown-codex.ts
      - name: Restart the tenant server
        if: always()
        run: sudo systemctl start mycel-ci-server || true
