# Feed heads (docs/RELEASE-CI.md 6): change what a channel's head says about the release it already names, without a
# build or a new version. Run by hand from main (Actions › Feed › Run workflow):
#
#   promote   a good release to every server and office now: ends the staged roll-out (as `Rollout: all` would have)
#   hold      pause a bad release's roll-out (reason required)
#   resume    give a held roll-out back where it stopped
#   held      what the heads say now (reads only; no key)
#
# It runs scripts/release/hosting.ts (scripts/release/hold.ts), which re-signs only the channel heads
# (server/<channel>.json + .sig, and the office list when it is at the same version) and never touches a version's own
# files. `version` must be the version the head names (a guard against changing the wrong release). Dry run first:
# the log says what would be uploaded. Same concurrency group as release.yml, so it never runs while a release
# publishes (but do not start it while a release run waits: GitHub would cancel that waiting run). Runs from main: if
# the `release` environment ever gets "only v* tags", main must be allowed there too. Secrets as in release.yml: RELEASE_SIGNING_KEY (in a 600 file under $RUNNER_TEMP, removed whatever
# happens) and CLOUDFLARE_API_TOKEN, only in the step that uses them.
name: Feed

on:
  workflow_dispatch:
    inputs:
      action:
        description: "promote = everyone now; hold = pause; resume = go on; held = show (reads only)"
        required: true
        type: choice
        options: [held, promote, hold, resume]
      channel:
        description: "The channel whose head to change"
        required: true
        default: stable
        type: choice
        options: [stable, beta]
      version:
        description: "The version the head names now (e.g. 0.5.3): nothing changes when it names another"
        required: true
        type: string
      reason:
        description: "hold only: why (publish logs and `mycel-ctl status`)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Only say what would be uploaded"
        required: false
        default: true
        type: boolean

# the changes share release.yml's group (never while a release publishes; GitHub keeps one waiting run per group, so a
# Feed run would cancel a release run that waits: do not run it then); `held` only reads and has its own group
concurrency:
  group: ${{ inputs.action == 'held' && 'feed-read' || format('release-{0}', github.repository) }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.3.12

jobs:
  feed:
    name: Feed head (${{ inputs.action }} ${{ inputs.channel }} ${{ inputs.version }})
    # only the reviewed workflow on main holds the release key
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTION: ${{ inputs.action }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      REASON: ${{ inputs.reason }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Inputs
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::version must look like 0.5.3 (no v)"; exit 1; fi
          if [ "$ACTION" = hold ] && [ -z "$REASON" ]; then echo "::error::hold needs a reason"; exit 1; fi
          if [ "$ACTION" != hold ] && [ -n "$REASON" ]; then echo "::error::reason is for hold only"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # no package's install script runs in the job that holds the key
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Release key (from the secret, never printed)
        if: inputs.action != 'held'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::error::secret RELEASE_SIGNING_KEY is not set (docs/RELEASE-CI.md)"; exit 1; fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          echo "TEAMAX_RELEASE_KEY=$RUNNER_TEMP/release-key.pem" >> "$GITHUB_ENV"
          bun scripts/release/release-ci.ts check-key "$RUNNER_TEMP/release-key.pem"
      - name: The heads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          args=("$ACTION" "$CHANNEL")
          if [ "$ACTION" != held ]; then args+=(--version "$VERSION"); fi
          if [ "$ACTION" = hold ]; then args+=(--reason "$REASON"); fi
          if [ "$DRY_RUN" = true ] && [ "$ACTION" != held ]; then args+=(--dry-run); fi
          bun scripts/release/hosting.ts "${args[@]}"
          if [ "$ACTION" != held ] && [ "$DRY_RUN" != true ]; then bun scripts/release/hosting.ts held "$CHANNEL"; fi
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
