# New-team server image (docs/RELEASE-CI.md "새 팀 서버 이미지"): the EC2 AMI that a new team's server starts from, built
# from a stable release's signed Linux kit, copied to every region, signed and put on the update feed beside the release.
#
#   release.yml build-ami   after a stable release is on the feed, starts this workflow on the release's tag
#   build-ami (here)        AWS through GitHub OIDC (no AWS key is stored anywhere), scripts/image/build-ami.sh in
#                           ap-northeast-2, ami-manifest-v2.sh --copy-to ap-southeast-1 + signature, publish-ami.ts,
#                           then ami-prune.sh keeps the CI's newest 3 images per region
#
# Its own workflow, not a job of release.yml: an image takes up to three hours, and release.yml's concurrency group is
# also the one of feed.yml (hold, promote). A hold must never wait for an image.
#
# Settings (docs/RELEASE-CI.md 10장 "처음 한 번"): repository variables AWS_ROLE_ARN and AMI_SUBNET_ID, the
# secrets RELEASE_SIGNING_KEY and CLOUDFLARE_API_TOKEN of the release environment. Without AWS_ROLE_ARN the job says so
# and does nothing; the release is never affected. The release key is in a 600 file only during the signing step.
name: Team image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "A stable release tag that is on the feed (e.g. v0.5.3). Choose the same tag under 'Use workflow from'."
        required: true
        type: string

concurrency:
  group: team-image-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.3.12
  GO_VERSION: 1.27.3
  GOTOOLCHAIN: local
  # the AWS regions of the new-team servers: the AMI is built in the first and copied to the others
  AMI_REGION: ap-northeast-2
  AMI_COPY_TO: ap-southeast-1
  AMI_KEEP: "3"

jobs:
  build-ami:
    name: Build, sign and publish the AMI
    runs-on: ubuntu-24.04
    # the release secrets and the AWS role's trust (sub = repo:<repo>:environment:release) live in this environment
    environment: release
    # builder ~30 min, snapshot up to 60, the copy to another region up to 90
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AMI_SUBNET_ID: ${{ vars.AMI_SUBNET_ID }}
    steps:
      - name: Tag and settings
        id: go
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then echo "::error::choose the tag $TAG under 'Use workflow from' (this run is from $GITHUB_REF)"; exit 1; fi
          if ! [[ "$TAG" =~ ^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,6}$ ]]; then echo "::error::$TAG is not a stable release tag (v0.5.3 form): images are built for stable releases only"; exit 1; fi
          missing=()
          [ -n "$AWS_ROLE_ARN" ] || missing+=("repository variable AWS_ROLE_ARN")
          [ -n "$AMI_SUBNET_ID" ] || missing+=("repository variable AMI_SUBNET_ID")
          [ "$HAVE_TOKEN" = true ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ "$HAVE_KEY" = true ] || missing+=("secret RELEASE_SIGNING_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::no team image for $TAG: not set up ($(IFS=,; echo "${missing[*]}")); docs/RELEASE-CI.md"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]+$ ]]; then echo "::error::AWS_ROLE_ARN is not an IAM role ARN"; exit 1; fi
          echo "account=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if ! [[ "$AMI_SUBNET_ID" =~ ^subnet-[0-9a-f]+$ ]]; then echo "::error::AMI_SUBNET_ID is not a subnet id"; exit 1; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.go.outputs.run == 'true'
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.go.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # no package's install script runs in the job that holds the key
      - if: steps.go.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: The release and its image on the feed
        id: release
        if: steps.go.outputs.run == 'true'
        run: |
          out=$(bun scripts/release/release-ci.ts tag "$TAG")
          echo "$out" | tee -a "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version=//p' <<<"$out")
          [ "$(sed -n 's/^channel=//p' <<<"$out")" = stable ] || { echo "::error::$TAG is not a stable release"; exit 1; }
          feed=$(bun -e 'import { RELEASE_CHANNEL } from "./shared/src/release-channel"; console.log(RELEASE_CHANNEL.feed)')
          # the release must be on the feed; an image that is there already ends the run (a re-run after a publish)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$feed/server/$version/release.json?t=$(date +%s)")
          if [ "$code" != 200 ]; then echo "::error::$feed/server/$version/release.json answers $code: publish the release first"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$feed/server/$version/team-image.json?t=$(date +%s)")
          if [ "$code" = 200 ]; then echo "::notice::$version has its team image on the feed already"; echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi
      - name: The release's signed linux-amd64 kit
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-linux-amd64.tar.gz' --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sig' --dir kit
          bun scripts/release/release-ci.ts verify-sums kit/SHA256SUMS
          k=$(ls kit/*-linux-amd64.tar.gz)
          grep -q "  $(basename "$k")\$" kit/SHA256SUMS || { echo "::error::$(basename "$k") is not in the release's SHA256SUMS"; exit 1; }
          echo "KIT=$k" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.release.outputs.build == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: mycel-enroll and mycel-link (linux amd64)
        if: steps.release.outputs.build == 'true'
        run: ARCHS=amd64 bash native/build.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.release.outputs.build == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AMI_REGION }}
          role-session-name: team-image-${{ github.run_id }}
          # the role's MaxSessionDuration must be at least this (docs/RELEASE-CI.md)
          role-duration-seconds: 14400
      # a re-run reuses the AMI an earlier attempt of this release made (build-ami.sh refuses a second one of a template)
      - name: Build the AMI (${{ env.AMI_REGION }})
        id: ami
        if: steps.release.outputs.build == 'true'
        env:
          ACCOUNT: ${{ steps.go.outputs.account }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # the backticks are JMESPath, not the shell
          read -r img tv <<<"$(aws ec2 describe-images --region "$AMI_REGION" --owners self \
            --filters Name=tag:ax:managed,Values=ami Name=tag:ax:built-by,Values=release-ci "Name=tag:ax:template,Values=$VERSION-d13-*" Name=state,Values=available \
            --query 'reverse(sort_by(Images,&CreationDate))[0].[ImageId,Tags[?Key==`ax:template`]|[0].Value]' --output text)"
          if [[ "$img" =~ ^ami-[0-9a-f]+$ ]]; then
            echo "::notice::reusing $img (template $tv) from an earlier attempt"
          else
            # SSH from this runner's address only (a security group made for the build); the subnet's NACL must let it in
            scripts/image/build-ami.sh --yes --account "$ACCOUNT" --region "$AMI_REGION" --kit "$KIT" \
              --enroll-bin native/bin/linux-amd64/mycel-enroll --link-bin native/bin/linux-amd64/mycel-link \
              --subnet-id "$AMI_SUBNET_ID" --tag ax:built-by=release-ci --out dist/image
            m=""; for f in dist/image/teamax-*.ami.json; do [[ "$f" == *.v2.ami.json ]] || m="$f"; done
            img=$(jq -r .imageId "$m"); tv=$(jq -r .templateVersion "$m")
          fi
          [[ "$img" =~ ^ami-[0-9a-f]+$ && "$tv" == "$VERSION"-d13-* ]] || { echo "::error::no AMI ($img, $tv)"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "template=$tv" >> "$GITHUB_OUTPUT"
      - name: Copy to ${{ env.AMI_COPY_TO }}, the v2 manifest and its signature
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          ACCOUNT: ${{ steps.go.outputs.account }}
          IMAGE: ${{ steps.ami.outputs.image }}
          TEMPLATE: ${{ steps.ami.outputs.template }}
        run: |
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          bun scripts/release/release-ci.ts check-key "$key"
          umask 022
          copies=()
          for r in $AMI_COPY_TO; do copies+=(--copy-to "$r"); done
          rm -f dist/image/teamax-"$TEMPLATE".v2.ami.json*
          scripts/image/build-ami.sh --manifest-v2 --yes --account "$ACCOUNT" --template-version "$TEMPLATE" \
            --image "$AMI_REGION=$IMAGE" "${copies[@]}" --sign-key "$key" --out dist/image
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
      - name: Publish the manifest on the feed
        if: steps.release.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          TEMPLATE: ${{ steps.ami.outputs.template }}
        run: bun scripts/release/publish-ami.ts --version "$VERSION" --manifest "dist/image/teamax-$TEMPLATE.v2.ami.json"
      - name: Keep the newest ${{ env.AMI_KEEP }} images per region
        if: steps.release.outputs.build == 'true'
        env:
          ACCOUNT: ${{ steps.go.outputs.account }}
        run: |
          regions=(--region "$AMI_REGION")
          for r in $AMI_COPY_TO; do regions+=(--region "$r"); done
          scripts/image/ami-prune.sh --account "$ACCOUNT" --keep "$AMI_KEEP" "${regions[@]}"
      # a cancelled or timed-out run can leave the builder behind: its state file names exactly what to remove
      # (scripts/image/build-ami.sh --cleanup <file>)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !success() && steps.release.outputs.build == 'true' }}
        with:
          name: ami-build-state
          path: |
            dist/image/*.state
            dist/image/*.log
            dist/image/*.json
          if-no-files-found: ignore
          retention-days: 30
