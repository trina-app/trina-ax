# New-team server image (docs/RELEASE-CI.md "새 팀 서버 이미지"): the EC2 AMI that a new team's server starts from, built
# from a stable release's signed Linux kit, copied to every region, signed and put on the update feed beside the release.
#
#   release.yml build-ami   after a stable release is on the feed and its GitHub Release exists, starts this workflow
#                           on the release's tag
#   build-ami (here)        AWS through GitHub OIDC (no AWS key is stored anywhere), scripts/image/build-ami.sh in
#                           ap-northeast-2, ami-manifest-v2.sh --copy-to for each AMI_COPY_TO region, a short signing step,
#                           publish-ami.ts, then ami-prune.sh removes the CI's old images per region (keeps the newest 5
#                           releases, anything younger than 14 days, anything tagged ax:keep or still in use)
#   qcow2 (here)            after build-ami: the AMI's root snapshot as a signed qcow2 beside the AMI manifest, for the
#                           control plane's Proxmox hosts (scripts/image/snapshot-to-qcow2.ts, publish-qcow2.ts). Its
#                           failure never fails the AMI
#   lightsail (here)        after build-ami: the same image as a Lightsail instance snapshot in Seoul, built on Lightsail
#                           (scripts/image/build-lightsail.sh), its signed .lightsail.json beside the AMI manifest, for
#                           the hostd lightsail driver of the paid team servers. Its failure never fails the AMI
#
# Its own workflow, not a job of release.yml: an image takes up to three hours, and release.yml's concurrency group is
# also the one of feed.yml (hold, promote). A hold must never wait for an image. GitHub keeps one pending run per
# concurrency group: two stable releases close together can drop the older one's run (run it again by hand).
#
# Settings (docs/RELEASE-CI.md 10장 "처음 한 번"): repository variables AWS_ROLE_ARN and AMI_SUBNET_ID, the secrets
# RELEASE_SIGNING_KEY and CLOUDFLARE_API_TOKEN (repository or environment release). Without AWS_ROLE_ARN the job says so
# and does nothing; the release is never affected. The release key is in a 600 file only during the signing step. The
# AWS role trusts only this file on a v* tag in the release environment (docs/runbooks/team-image-trust-policy.json).
name: Team image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "A stable release tag that is on the feed (e.g. v0.5.3). Choose the same tag under 'Use workflow from'."
        required: true
        type: string

concurrency:
  group: team-image-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.3.12
  GO_VERSION: 1.27.3
  GOTOOLCHAIN: local
  # the AWS regions of the new-team servers: the AMI is built in the first and copied to the others. A region that a
  # hostd serves must be here before that region is added to the hostd config (hostd installTemplate refuses a manifest
  # without an image for one of its regions). The CI role (docs/runbooks/team-image-iam-policy.json) must allow every
  # region here first, or the copy and the whole run fail.
  AMI_REGION: ap-northeast-2
  AMI_COPY_TO: ap-southeast-1 us-east-1
  # ami-prune.sh: the newest AMI_KEEP releases and every image younger than AMI_MIN_AGE_DAYS stay. The control plane
  # makes new teams from an older release while a newer one's hosted rollout bakes (2026-11-20: 0.5.16 was removed
  # while still the new-team template, five releases behind), and the CI cannot read the control plane.
  AMI_KEEP: "5"
  AMI_MIN_AGE_DAYS: "14"

jobs:
  build-ami:
    name: Build, sign and publish the AMI
    runs-on: ubuntu-24.04
    # the release secrets and the AWS role's trust (sub = repo:<repo>:environment:release:job_workflow_ref:…) need it
    environment: release
    # builder ~30 min, snapshot up to 60, each copy to another region up to 90 (one after the other; a copy took ~3 min
    # to Singapore in v0.5.9-v0.5.11)
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AMI_SUBNET_ID: ${{ vars.AMI_SUBNET_ID }}
    steps:
      - name: Tag and settings
        id: go
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then echo "::error::choose the tag $TAG under 'Use workflow from' (this run is from $GITHUB_REF)"; exit 1; fi
          if ! [[ "$TAG" =~ ^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,6}$ ]]; then echo "::error::$TAG is not a stable release tag (v0.5.3 form): images are built for stable releases only"; exit 1; fi
          # the commit of this run (workflow file and code) is still the tag's: a moved tag stops here
          got=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$got" != "$GITHUB_SHA" ]; then echo "::error::$TAG now names $got, not this run's $GITHUB_SHA"; exit 1; fi
          missing=()
          [ -n "$AWS_ROLE_ARN" ] || missing+=("repository variable AWS_ROLE_ARN")
          [ -n "$AMI_SUBNET_ID" ] || missing+=("repository variable AMI_SUBNET_ID")
          [ "$HAVE_TOKEN" = true ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ "$HAVE_KEY" = true ] || missing+=("secret RELEASE_SIGNING_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::no team image for $TAG: not set up ($(IFS=,; echo "${missing[*]}")); docs/RELEASE-CI.md"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]+$ ]]; then echo "::error::AWS_ROLE_ARN is not an IAM role ARN"; exit 1; fi
          echo "account=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          # one subnet, or a comma list of subnets of one VPC in other zones, tried in order when a zone has no capacity
          if ! [[ "$AMI_SUBNET_ID" =~ ^subnet-[0-9a-f]+(,subnet-[0-9a-f]+)*$ ]]; then echo "::error::AMI_SUBNET_ID is not a subnet id or a comma list of them"; exit 1; fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      # the commit checked above, not the tag again (it could move in between)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.go.outputs.run == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.go.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # no package's install script runs in the job that holds the key
      - if: steps.go.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: The release and its image on the feed
        id: release
        if: steps.go.outputs.run == 'true'
        run: |
          out=$(bun scripts/release/release-ci.ts tag "$TAG")
          echo "$out" | tee -a "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version=//p' <<<"$out")
          [ "$(sed -n 's/^channel=//p' <<<"$out")" = stable ] || { echo "::error::$TAG is not a stable release"; exit 1; }
          feed=$(bun -e 'import { RELEASE_CHANNEL } from "./shared/src/release-channel"; console.log(RELEASE_CHANNEL.feed)')
          echo "feed=$feed" >> "$GITHUB_OUTPUT"
          # the release must be on the feed; an image that is there already ends the run (a re-run after a publish)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$feed/server/$version/release.json?t=$(date +%s)")
          if [ "$code" != 200 ]; then echo "::error::$feed/server/$version/release.json answers $code: publish the release first"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$feed/server/$version/team-image.json?t=$(date +%s)")
          if [ "$code" = 200 ]; then echo "::notice::$version has its team image on the feed already"; echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi
      - name: The release's signed linux-amd64 kit
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-linux-amd64.tar.gz' --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sig' --dir kit
          bun scripts/release/release-ci.ts verify-sums kit/SHA256SUMS
          k=$(ls kit/*-linux-amd64.tar.gz)
          grep -q "  $(basename "$k")\$" kit/SHA256SUMS || { echo "::error::$(basename "$k") is not in the release's SHA256SUMS"; exit 1; }
          echo "KIT=$k" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.release.outputs.build == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: mycel-enroll and mycel-link (linux amd64)
        if: steps.release.outputs.build == 'true'
        run: ARCHS=amd64 bash native/build.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.release.outputs.build == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AMI_REGION }}
          role-session-name: team-image-${{ github.run_id }}
          # the role's MaxSessionDuration must be at least this (docs/RELEASE-CI.md)
          role-duration-seconds: 14400
      # a re-run reuses the AMI an earlier attempt of this release made (build-ami.sh refuses a second one of a template);
      # one a cancel left "pending" is waited for
      - name: Build the AMI (${{ env.AMI_REGION }})
        id: ami
        if: steps.release.outputs.build == 'true'
        env:
          ACCOUNT: ${{ steps.go.outputs.account }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # the backticks are JMESPath, not the shell
          read -r img tv <<<"$(aws ec2 describe-images --region "$AMI_REGION" --owners self \
            --filters Name=tag:ax:managed,Values=ami Name=tag:ax:built-by,Values=release-ci "Name=tag:ax:template,Values=$VERSION-d13-*" Name=state,Values=available,pending \
            --query 'reverse(sort_by(Images,&CreationDate))[0].[ImageId,Tags[?Key==`ax:template`]|[0].Value]' --output text)"
          if [[ "$img" =~ ^ami-[0-9a-f]+$ ]]; then
            echo "::notice::reusing $img (template $tv) from an earlier attempt"
            aws ec2 wait image-available --region "$AMI_REGION" --image-ids "$img"
          else
            # SSH from this runner's address only (a security group made for the build); the subnet's NACL must let it in
            scripts/image/build-ami.sh --yes --account "$ACCOUNT" --region "$AMI_REGION" --kit "$KIT" \
              --enroll-bin native/bin/linux-amd64/mycel-enroll --link-bin native/bin/linux-amd64/mycel-link \
              --subnet-id "$AMI_SUBNET_ID" --tag ax:built-by=release-ci --out dist/image
            m=""; for f in dist/image/teamax-*.ami.json; do [[ "$f" == *.v2.ami.json ]] || m="$f"; done
            img=$(jq -r .imageId "$m"); tv=$(jq -r .templateVersion "$m")
          fi
          [[ "$img" =~ ^ami-[0-9a-f]+$ && "$tv" == "$VERSION"-d13-* ]] || { echo "::error::no AMI ($img, $tv)"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "template=$tv" >> "$GITHUB_OUTPUT"
      # a re-run after a partial publish: the signed manifest of this template is on the feed already. It is taken as it
      # is (a new one would have another builtAt, and the feed never takes other bytes); publish-ami checks it.
      - name: The manifest on the feed already?
        id: onfeed
        if: steps.release.outputs.build == 'true'
        env:
          FEED: ${{ steps.release.outputs.feed }}
          VERSION: ${{ steps.release.outputs.version }}
          TEMPLATE: ${{ steps.ami.outputs.template }}
        run: |
          mkdir -p dist/image
          name="teamax-$TEMPLATE.v2.ami.json"
          rm -f dist/image/"$name"*
          ok=true
          for x in "" .sha256 .sig; do
            curl -sf -o "dist/image/$name$x" "$FEED/server/$VERSION/$name$x?t=$(date +%s)" || ok=false
          done
          if [ "$ok" = true ]; then echo "::notice::$name is on the feed already: taken as it is"; else rm -f dist/image/"$name"*; fi
          echo "have=$ok" >> "$GITHUB_OUTPUT"
      - name: Copy to ${{ env.AMI_COPY_TO }} and the v2 manifest
        if: steps.release.outputs.build == 'true' && steps.onfeed.outputs.have != 'true'
        env:
          ACCOUNT: ${{ steps.go.outputs.account }}
          IMAGE: ${{ steps.ami.outputs.image }}
          TEMPLATE: ${{ steps.ami.outputs.template }}
        run: |
          copies=()
          for r in $AMI_COPY_TO; do copies+=(--copy-to "$r"); done
          # unsigned here: the copy takes up to 90 minutes, the key is only there for the signing step below
          scripts/image/build-ami.sh --manifest-v2 --yes --account "$ACCOUNT" --template-version "$TEMPLATE" \
            --image "$AMI_REGION=$IMAGE" "${copies[@]}" --out dist/image
      # the message of ami-manifest-v2.sh and hostd: "ax-template-v1\n<templateVersion>\n<sha256 hex>", base64 Ed25519
      - name: Sign the manifest
        if: steps.release.outputs.build == 'true' && steps.onfeed.outputs.have != 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TEMPLATE: ${{ steps.ami.outputs.template }}
        run: |
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          m="dist/image/teamax-$TEMPLATE.v2.ami.json"
          sha=$(sha256sum "$m" | cut -d' ' -f1)
          [ "$(cat "$m.sha256")" = "$sha  $(basename "$m")" ] || { echo "::error::$m.sha256 does not match"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          bun scripts/release/release-ci.ts check-key "$key"
          printf 'ax-template-v1\n%s\n%s' "$TEMPLATE" "$sha" > "$RUNNER_TEMP/sigmsg"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/sigmsg" -out "$RUNNER_TEMP/sig.bin"
          rm -f "$key"
          umask 022
          base64 -w0 < "$RUNNER_TEMP/sig.bin" > "$m.sig"
          rm -f "$RUNNER_TEMP/sigmsg" "$RUNNER_TEMP/sig.bin"
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
      # publish-ami checks the signature against this product's keys before anything goes up
      - name: Publish the manifest on the feed
        if: steps.release.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          TEMPLATE: ${{ steps.ami.outputs.template }}
        run: bun scripts/release/publish-ami.ts --version "$VERSION" --manifest "dist/image/teamax-$TEMPLATE.v2.ami.json"
      - name: Remove old images (keep the newest ${{ env.AMI_KEEP }} releases, younger than ${{ env.AMI_MIN_AGE_DAYS }} days, in use)
        if: steps.release.outputs.build == 'true'
        env:
          ACCOUNT: ${{ steps.go.outputs.account }}
          TEMPLATE: ${{ steps.ami.outputs.template }}
        run: |
          regions=(--region "$AMI_REGION")
          for r in $AMI_COPY_TO; do regions+=(--region "$r"); done
          scripts/image/ami-prune.sh --account "$ACCOUNT" --keep "$AMI_KEEP" --protect-template "$TEMPLATE" --min-age-days "$AMI_MIN_AGE_DAYS" "${regions[@]}"
      # a cancel or a time-out can stop build-ami.sh before its own clean-up: remove exactly what its state file names
      - name: Remove what an interrupted build left behind
        if: (cancelled() || failure()) && steps.release.outputs.build == 'true'
        env:
          ACCOUNT: ${{ steps.go.outputs.account }}
        run: |
          for s in dist/image/ami-build-*.state; do
            [ -s "$s" ] || continue
            scripts/image/build-ami.sh --cleanup "$s" --account "$ACCOUNT" --region "$AMI_REGION" || echo "::warning::clean-up of $s did not finish: see the ami-build-state artifact"
          done
      # the fallback: the state file names exactly what to remove (scripts/image/build-ami.sh --cleanup <file>)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() && steps.release.outputs.build == 'true' }}
        with:
          name: ami-build-state
          path: dist/image/*.state
          if-no-files-found: ignore
          retention-days: 7

  # The Proxmox twin of the AMI (trina-cloud DECISIONS FS-11): the root snapshot of the AMI in AMI_REGION as a qcow2,
  # signed with the release key, beside the AMI manifest (scripts/image/snapshot-to-qcow2.ts,
  # scripts/release/publish-qcow2.ts). The same bytes and the same template version as the AMI, so the control plane
  # installs it on its Proxmox hosts (the free host) with the AMI. Its own job: a failure here never fails or delays the
  # AMI, and it reads the feed itself (not the AMI job's outputs), so a re-run of a failed qcow2 makes only the qcow2.
  # Settings: as build-ami, and the CI role needs "QcowFromCiSnapshots" (docs/runbooks/team-image-iam-policy.json).
  qcow2:
    name: Proxmox image (qcow2 of the AMI)
    needs: build-ami
    if: ${{ !cancelled() && needs.build-ami.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    # download ~20 min (EBS direct APIs, 16 in parallel), compress ~20 min, upload ~10 min
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - name: Settings
        id: go
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
        run: |
          missing=()
          [ -n "$AWS_ROLE_ARN" ] || missing+=("repository variable AWS_ROLE_ARN")
          [ "$HAVE_TOKEN" = true ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ "$HAVE_KEY" = true ] || missing+=("secret RELEASE_SIGNING_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::no qcow2 for $TAG: not set up ($(IFS=,; echo "${missing[*]}")); docs/RELEASE-CI.md"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.go.outputs.run == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.go.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # no package's install script runs in the job that holds the key
      - if: steps.go.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      # the AMI manifest from the feed, checked as hostd checks it (signature included): its root snapshot in AMI_REGION
      # is what becomes the qcow2. A qcow2 manifest on the feed already ends the run.
      - name: The AMI manifest and the qcow2 on the feed
        id: feed
        if: steps.go.outputs.run == 'true'
        run: |
          out=$(bun scripts/release/release-ci.ts tag "$TAG")
          version=$(sed -n 's/^version=//p' <<<"$out")
          feed=$(bun -e 'import { RELEASE_CHANNEL } from "./shared/src/release-channel"; console.log(RELEASE_CHANNEL.feed)')
          dir="$feed/server/$version"
          if ! ptr=$(curl -sf "$dir/team-image.json?t=$(date +%s)"); then echo "::notice::$version has no team image on the feed: no qcow2"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          tv=$(jq -r .templateVersion <<<"$ptr"); name=$(jq -r .manifest <<<"$ptr")
          [[ "$tv" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?-d13-[0-9]{8}$ && "$name" == "teamax-$tv.v2.ami.json" ]] || { echo "::error::team-image.json names $tv / $name"; exit 1; }
          if curl -sf -o /dev/null "$dir/teamax-$tv.qcow2.json?t=$(date +%s)"; then echo "::notice::teamax-$tv.qcow2 is on the feed already"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p dist/ami dist/image
          for x in "" .sha256 .sig; do curl -sf -o "dist/ami/$name$x" "$dir/$name$x?t=$(date +%s)" || { echo "::error::$name$x is not on the feed"; exit 1; }; done
          V="$version" M="dist/ami/$name" bun -e 'import { checkManifest } from "./scripts/release/publish-ami"; checkManifest(process.env.V!, process.env.M!)'
          snap=$(jq -r --arg r "$AMI_REGION" '.images[$r].rootSnapshotId // ""' "dist/ami/$name")
          [[ "$snap" =~ ^snap-[0-9a-f]+$ ]] || { echo "::error::$name has no root snapshot in $AMI_REGION"; exit 1; }
          { echo "build=true"; echo "version=$version"; echo "template=$tv"; echo "snapshot=$snap"; } | tee -a "$GITHUB_OUTPUT"
      - name: qemu-img
        if: steps.feed.outputs.build == 'true'
        run: |
          # the runner image's Microsoft apt source answered 403 (2026-11-27) and failed the apt index update; every package here is Ubuntu's
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-utils
          # the raw file is the volume's size (sparse): on /mnt, the runner's big disk
          sudo mkdir -p /mnt/qcow2-work && sudo chown "$(id -u):$(id -g)" /mnt/qcow2-work
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.feed.outputs.build == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AMI_REGION }}
          role-session-name: team-image-qcow2-${{ github.run_id }}
          role-duration-seconds: 7200
          # this job only reads one snapshot: the session is cut down to the EBS direct reads and the KMS decrypt of the
          # encrypted snapshot (the role's own policy still applies on top; STS GetCallerIdentity is always allowed)
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ebs:ListSnapshotBlocks","ebs:GetSnapshotBlock"],"Resource":"arn:aws:ec2:ap-northeast-2::snapshot/*"},{"Effect":"Allow","Action":"kms:Decrypt","Resource":"*"}]}
      - name: The root snapshot as a qcow2
        if: steps.feed.outputs.build == 'true'
        env:
          TEMPLATE: ${{ steps.feed.outputs.template }}
          SNAPSHOT: ${{ steps.feed.outputs.snapshot }}
        run: bun scripts/image/snapshot-to-qcow2.ts --region "$AMI_REGION" --snapshot "$SNAPSHOT" --template-version "$TEMPLATE" --out dist/image --work /mnt/qcow2-work
      # what hostd installTemplate checks: "ax-template-v1\n<templateVersion>\n<sha256 of the qcow2>", base64 Ed25519
      - name: Sign the qcow2
        if: steps.feed.outputs.build == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TEMPLATE: ${{ steps.feed.outputs.template }}
        run: |
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          q="dist/image/teamax-$TEMPLATE.qcow2"
          sha=$(sha256sum "$q" | cut -d' ' -f1)
          [ "$(cat "$q.sha256")" = "$sha  $(basename "$q")" ] || { echo "::error::$q.sha256 does not match"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          bun scripts/release/release-ci.ts check-key "$key"
          printf 'ax-template-v1\n%s\n%s' "$TEMPLATE" "$sha" > "$RUNNER_TEMP/sigmsg"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/sigmsg" -out "$RUNNER_TEMP/sig.bin"
          rm -f "$key"
          umask 022
          base64 -w0 < "$RUNNER_TEMP/sig.bin" > "$q.sig"
          rm -f "$RUNNER_TEMP/sigmsg" "$RUNNER_TEMP/sig.bin"
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
      # publish-qcow2 checks the signature against this product's keys before anything goes up; the image goes up in
      # parts through R2's S3 API (the same Cloudflare token), the manifest last
      - name: Publish the qcow2 on the feed
        if: steps.feed.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.feed.outputs.version }}
          TEMPLATE: ${{ steps.feed.outputs.template }}
          SNAPSHOT: ${{ steps.feed.outputs.snapshot }}
        run: |
          m=$(bun scripts/release/publish-qcow2.ts manifest --version "$VERSION" --qcow2 "dist/image/teamax-$TEMPLATE.qcow2" --snapshot "$AMI_REGION=$SNAPSHOT")
          bun scripts/release/publish-qcow2.ts publish --version "$VERSION" --manifest "$m"

  # The Lightsail twin of the AMI (trina-cloud docs/research/lightsail-paid-teams.md §6.2): Lightsail cannot import an
  # AMI, so scripts/image/build-lightsail.sh makes the image again on a Lightsail builder from the same stage and the
  # same customize.sh, as an instance snapshot teamax-<templateVersion> in LIGHTSAIL_REGION, and writes its manifest
  # teamax-<templateVersion>.lightsail.json; it is signed here and put on the feed beside the AMI manifest. The template
  # version is the AMI's (team-image.json), so hostd and the control plane see one version per release. Its own job: a
  # failure here never fails the AMI or the qcow2, and a re-run of a failed lightsail job makes only the Lightsail image.
  # Settings: as build-ami, and the CI role needs the managed policy docs/runbooks/team-image-lightsail-iam-policy.json (its
  # own policy: the inline one of the role is near the IAM limit of 10,240 characters for all inline policies of a role).
  lightsail:
    name: Lightsail image (instance snapshot)
    needs: build-ami
    if: ${{ !cancelled() && needs.build-ami.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release
    # stage ~5 min, builder up to LIGHTSAIL_WAIT_MIN (a new instance starts at about 0 % CPU burst, design R3), the
    # snapshot up to 90 min. The AWS session below lasts 4 hours (the role's MaxSessionDuration).
    timeout-minutes: 270
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      LIGHTSAIL_REGION: ap-northeast-2
      LIGHTSAIL_WAIT_MIN: "140"
    steps:
      - name: Settings
        id: go
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
        run: |
          missing=()
          [ -n "$AWS_ROLE_ARN" ] || missing+=("repository variable AWS_ROLE_ARN")
          [ "$HAVE_TOKEN" = true ] || missing+=("secret CLOUDFLARE_API_TOKEN")
          [ "$HAVE_KEY" = true ] || missing+=("secret RELEASE_SIGNING_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::no Lightsail image for $TAG: not set up ($(IFS=,; echo "${missing[*]}")); docs/RELEASE-CI.md"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/[A-Za-z0-9+=,.@_/-]+$ ]]; then echo "::error::AWS_ROLE_ARN is not an IAM role ARN"; exit 1; fi
          echo "account=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.go.outputs.run == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.go.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # no package's install script runs in the job that holds the key
      - if: steps.go.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      # the template version of the release's AMI; a Lightsail manifest on the feed already ends the run
      - name: The template version and the Lightsail image on the feed
        id: feed
        if: steps.go.outputs.run == 'true'
        run: |
          out=$(bun scripts/release/release-ci.ts tag "$TAG")
          version=$(sed -n 's/^version=//p' <<<"$out")
          feed=$(bun -e 'import { RELEASE_CHANNEL } from "./shared/src/release-channel"; console.log(RELEASE_CHANNEL.feed)')
          dir="$feed/server/$version"
          if ! ptr=$(curl -sf "$dir/team-image.json?t=$(date +%s)"); then echo "::notice::$version has no team image on the feed: no Lightsail image"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          tv=$(jq -r .templateVersion <<<"$ptr")
          [[ "$tv" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?-d13-[0-9]{8}$ && "$tv" == "$version"-d13-* ]] || { echo "::error::team-image.json names template $tv"; exit 1; }
          if curl -sf -o /dev/null "$dir/teamax-$tv.lightsail.json?t=$(date +%s)"; then echo "::notice::teamax-$tv.lightsail.json is on the feed already"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          { echo "build=true"; echo "version=$version"; echo "template=$tv"; } | tee -a "$GITHUB_OUTPUT"
      - name: The release's signed linux-amd64 kit
        if: steps.feed.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kit
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-linux-amd64.tar.gz' --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sig' --dir kit
          bun scripts/release/release-ci.ts verify-sums kit/SHA256SUMS
          k=$(ls kit/*-linux-amd64.tar.gz)
          grep -q "  $(basename "$k")\$" kit/SHA256SUMS || { echo "::error::$(basename "$k") is not in the release's SHA256SUMS"; exit 1; }
          (cd kit && sha256sum -c --ignore-missing --status SHA256SUMS) || { echo "::error::$(basename "$k") does not match SHA256SUMS"; exit 1; }
          echo "KIT=$k" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.feed.outputs.build == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: mycel-enroll and mycel-link (linux amd64)
        if: steps.feed.outputs.build == 'true'
        run: ARCHS=amd64 bash native/build.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.feed.outputs.build == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.LIGHTSAIL_REGION }}
          role-session-name: team-image-lightsail-${{ github.run_id }}
          role-duration-seconds: 14400
      # a re-run reuses the snapshot an earlier attempt made (available, with the right tags) and writes only the manifest
      - name: Build the Lightsail image (${{ env.LIGHTSAIL_REGION }})
        if: steps.feed.outputs.build == 'true'
        env:
          # the stage and the builder's result go through R2 (ci/lightsail-build/, not served by the feed)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ steps.go.outputs.account }}
          TEMPLATE: ${{ steps.feed.outputs.template }}
        run: |
          scripts/image/build-lightsail.sh --yes --account "$ACCOUNT" --region "$LIGHTSAIL_REGION" --template-version "$TEMPLATE" \
            --kit "$KIT" --enroll-bin native/bin/linux-amd64/mycel-enroll --link-bin native/bin/linux-amd64/mycel-link \
            --wait-minutes "$LIGHTSAIL_WAIT_MIN" --out dist/image
      # the message of the AMI manifest and of hostd: "ax-template-v1\n<templateVersion>\n<sha256 hex>", base64 Ed25519
      - name: Sign the manifest
        if: steps.feed.outputs.build == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TEMPLATE: ${{ steps.feed.outputs.template }}
        run: |
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          m="dist/image/teamax-$TEMPLATE.lightsail.json"
          sha=$(sha256sum "$m" | cut -d' ' -f1)
          [ "$(cat "$m.sha256")" = "$sha  $(basename "$m")" ] || { echo "::error::$m.sha256 does not match"; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          bun scripts/release/release-ci.ts check-key "$key"
          printf 'ax-template-v1\n%s\n%s' "$TEMPLATE" "$sha" > "$RUNNER_TEMP/sigmsg"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/sigmsg" -out "$RUNNER_TEMP/sig.bin"
          rm -f "$key"
          umask 022
          base64 -w0 < "$RUNNER_TEMP/sig.bin" > "$m.sig"
          rm -f "$RUNNER_TEMP/sigmsg" "$RUNNER_TEMP/sig.bin"
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
      # lightsail-feed.ts checks the manifest and its signature against this product's keys before anything goes up;
      # the manifest goes last
      - name: Publish the manifest on the feed
        if: steps.feed.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.feed.outputs.version }}
          TEMPLATE: ${{ steps.feed.outputs.template }}
        run: bun scripts/image/lightsail-feed.ts publish --version "$VERSION" --manifest "dist/image/teamax-$TEMPLATE.lightsail.json"
      - name: Remove old Lightsail images (keep the newest ${{ env.AMI_KEEP }} releases, younger than ${{ env.AMI_MIN_AGE_DAYS }} days, in use)
        if: steps.feed.outputs.build == 'true'
        env:
          ACCOUNT: ${{ steps.go.outputs.account }}
          TEMPLATE: ${{ steps.feed.outputs.template }}
        run: scripts/image/build-lightsail.sh --prune --account "$ACCOUNT" --region "$LIGHTSAIL_REGION" --keep "$AMI_KEEP" --min-age-days "$AMI_MIN_AGE_DAYS" --protect-template "$TEMPLATE"
      # a cancel or a time-out can stop build-lightsail.sh before its own clean-up: remove exactly what its state file names
      - name: Remove what an interrupted build left behind
        if: (cancelled() || failure()) && steps.feed.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ steps.go.outputs.account }}
        run: |
          for s in dist/image/lightsail-build-*.state; do
            [ -s "$s" ] || continue
            scripts/image/build-lightsail.sh --cleanup "$s" --account "$ACCOUNT" --region "$LIGHTSAIL_REGION" || echo "::warning::clean-up of $s did not finish: see the lightsail-build-state artifact"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !success() && steps.feed.outputs.build == 'true' }}
        with:
          name: lightsail-build-state
          path: dist/image/lightsail-build-*.state
          if-no-files-found: ignore
          retention-days: 7
