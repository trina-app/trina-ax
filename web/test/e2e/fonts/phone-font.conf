<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The web e2e suite on Linux (.github/workflows/feature-map.yml): a phone's font in place of DejaVu Sans.
     The app's font stack (web/src/index.css, -apple-system ... Roboto, system-ui, sans-serif) finds Apple's fonts on a
     Mac and an iPhone and Roboto on Android; a Linux runner has neither, so its sans-serif (DejaVu Sans, much wider)
     drew every phone layout wider than any phone does, and the specs that measure text against its box failed there only.
     With the distro's Roboto (fonts-roboto-unhinted) installed, this file makes it the generic families' first choice;
     the CJK fonts the runner already has stay the fallback for Korean, Japanese and Chinese.
     Installed by the workflow as /etc/fonts/conf.d/99-mycel-e2e-phone-font.conf; for a local repro, see web/README.md. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
</fontconfig>
